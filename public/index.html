<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ナノリアイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#cde7f5;--ink:#14213d;--paper:#fffdf4;--coral:#ff5c7a;--sun:#ffd23f;--mint:#6fd9b8;--mute:#55617f;--disp:"Dela Gothic One","Zen Maru Gothic",sans-serif;--boing:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font:500 18px/1.7 "Zen Maru Gothic",sans-serif;min-height:100vh;overflow-x:hidden}
main{max-width:1160px;margin:0 auto;padding:20px 16px 64px}
#home,#setup,#coll,#settings,#stage{max-width:580px;margin-inline:auto}
[hidden]{display:none!important}
h2{font:400 1.9rem/1.3 var(--disp);margin:8px 0 14px}
/* ---- ポップなアニメーション ---- */
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}55%{transform:scale(1.12) rotate(2deg);opacity:1}78%{transform:scale(.96)}100%{transform:none;opacity:1}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.08)}75%{transform:rotate(4deg) scale(1.08)}}
@keyframes bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
@keyframes slam{0%{transform:translateY(-70px) scale(1.5) rotate(-5deg);opacity:0}60%{transform:translateY(8px) rotate(-1deg);opacity:1}80%{transform:translateY(-3px) rotate(-1deg)}100%{transform:rotate(-1deg)}}
@keyframes starpop{0%{transform:scale(1)}35%{transform:scale(2.2) rotate(30deg)}70%{transform:scale(.8) rotate(-10deg)}100%{transform:scale(1)}}
@keyframes squish{0%{transform:scale(1)}40%{transform:scale(1.25,.8)}100%{transform:scale(1)}}
:where(section:not([hidden])>*,#stage>*,#arena>*,#ctl>*,.grid>*){animation:pop .5s backwards;animation-delay:calc(var(--i,0)*.07s)}
button{font:inherit;font-size:1.1rem;font-weight:700;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:999px;padding:10px 26px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .2s var(--boing),box-shadow .2s}
button:hover{animation:wob .45s;box-shadow:6px 6px 0 var(--ink)}
button:active{animation:squish .25s;transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button.pri{background:var(--coral)}button.ghost{background:var(--paper)}
button:disabled{opacity:.5;cursor:default;animation:none}
button.sm{padding:3px 16px;font-size:.95rem;box-shadow:3px 3px 0 var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
input{font:inherit;font-size:1.2rem;width:100%;padding:12px 14px;border:3px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);transition:transform .25s var(--boing)}
input:focus{transform:scale(1.03) rotate(-.5deg)}
label{display:block;font-weight:700;margin:16px 0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.logo{display:flex;justify-content:center;gap:8px;margin:32px 0 12px}
.logo span{width:clamp(54px,16vw,80px);aspect-ratio:1;display:grid;place-items:center;font:400 clamp(1.9rem,9vw,3rem) var(--disp);border:3px solid var(--ink);border-radius:50% 50% 50% 12%;box-shadow:4px 4px 0 var(--ink);background:var(--paper);transition:transform .25s var(--boing);cursor:default}
.logo span:hover{animation:bob .5s}
.logo span:nth-child(1){transform:rotate(-6deg)}.logo span:nth-child(2){background:var(--sun);transform:rotate(4deg)}.logo span:nth-child(3){background:var(--coral);transform:rotate(-3deg)}.logo span:nth-child(4){background:var(--mint);transform:rotate(5deg)}.logo span:nth-child(5){transform:rotate(-4deg)}
.lead{text-align:center;margin:0 0 16px;font-size:1.1rem}
/* ---- 名乗り（正体）パネル ---- */
.nm{background:var(--paper);border:3px solid var(--ink);border-radius:30px 30px 30px 8px;padding:18px;box-shadow:5px 5px 0 var(--ink);transition:transform .3s var(--boing)}
.nm:hover{transform:rotate(-1.5deg) scale(1.03)}
.nm.weak{background:#e8e5da;border-style:dashed}
.nm h3{margin:0 0 8px;font:400 1.7rem/1.35 var(--disp);overflow-wrap:anywhere}
.nm p{margin:0 0 12px;font-size:1.15rem;line-height:1.75}
.nm .note{color:var(--mute);font-size:.95rem}
.nm .meta{color:var(--mute);font-size:.95rem;margin:10px 0 0}
.params{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:0;font-size:1.05rem}
.params dt{color:var(--mute)}.params dd{margin:0;font-weight:700;text-align:right}
.nm.back{display:grid;place-items:center;min-height:120px;background:var(--coral);font:400 2.6rem var(--disp);animation:bob 1s infinite}
.who{font:400 1.1rem var(--disp);margin:14px 0 6px}
.bars{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:1.1rem}
.bars div:last-child{text-align:right}
.st{letter-spacing:.12em;font-size:1.5rem}
.st i{font-style:normal;display:inline-block}
.st i.new{animation:starpop .8s .3s backwards}
.theme{background:var(--sun);border:3px solid var(--ink);padding:14px 18px;text-align:center;font:400 clamp(1.4rem,6vw,2rem)/1.4 var(--disp);transform:rotate(-1deg);margin:14px auto;max-width:680px;animation:slam .7s backwards;border-radius:8px 24px 8px 24px}
.arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:8px}
.chatwrap{display:flex;flex-direction:column;gap:10px}
.log{height:min(64vh,560px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px;background:rgba(255,255,255,.55);border:3px solid var(--ink);border-radius:20px}
.log>:first-child{margin-top:auto}
.msg{max-width:88%;padding:8px 14px;border:3px solid var(--ink);border-radius:20px;font-size:1.1rem;line-height:1.6;animation:pop .4s backwards;overflow-wrap:anywhere}
.msg small{display:block;font-size:.8rem;color:var(--mute);line-height:1.4}
.msg.me{align-self:flex-start;background:var(--mint);border-bottom-left-radius:4px}
.msg.opp{align-self:flex-end;background:var(--sun);border-bottom-right-radius:4px}
.msg.n{align-self:center;background:var(--paper);border-style:dashed;font-size:1rem;text-align:center;color:var(--mute)}
.ctl{display:flex;flex-direction:column;align-items:center;gap:12px}
.verdict{font:400 1.7rem/1.4 var(--disp);text-align:center;padding:14px;border:3px solid var(--ink);background:var(--mint);margin:16px 0;border-radius:24px;animation:slam .7s backwards}
.ctl .verdict{width:100%;margin:0}
.verdict.lose{background:var(--paper)}
.shout{font:400 clamp(2.2rem,10vw,3.2rem)/1.2 var(--disp);text-align:center;margin:10px 0 4px;color:var(--coral);text-shadow:3px 3px 0 var(--ink)}
.code{font:400 2.8rem var(--disp);letter-spacing:.2em;text-align:center;margin:8px 0}
.status{text-align:center;color:var(--mute);margin:16px 0}
.wait::before{content:"●●●";display:block;letter-spacing:.4em;color:var(--coral);animation:bob 1s infinite}
.grid{display:grid;gap:20px;margin-top:16px}
.err{color:#b3123a;font-weight:700;min-height:1.7em}
@media(max-width:900px){.arena{grid-template-columns:1fr 1fr}.chatwrap{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section id="home">
  <div class="logo" aria-label="ナノリアイ"><span>ナ</span><span>ノ</span><span>リ</span><span>ア</span><span>イ</span></div>
  <p class="lead">われこそは、と名乗れ。名前の力で勝負が決まる。<br>先に星を3つ集めた者が、名乗り王だ！</p>
  <p class="lead">いまの名前：<b id="homeName"></b></p>
  <div class="row" style="justify-content:center"><button class="pri" id="goSetup">名乗り合う！</button><button class="ghost" id="goColl">名乗り図鑑</button><button class="ghost" id="goSettings">設定</button></div>
</section>

<section id="settings" hidden>
  <h2>設定</h2>
  <label for="name">あなたの名前（相手にも見えます）</label>
  <input id="name" maxlength="12" autocomplete="off">
  <div class="row"><button class="ghost" id="rand">ランダムで決める</button><button class="pri" id="saveName">これでいく！</button></div>
</section>

<section id="setup" hidden>
  <h2>名乗り合いの場</h2>
  <div class="row"><button class="pri" id="create">場をひらく</button></div>
  <label for="joinCode">友だちの合言葉で場に入る</label>
  <input id="joinCode" maxlength="8" placeholder="例: K7M2" autocomplete="off" style="text-transform:uppercase">
  <div class="row"><button id="join">この場に入る</button><button class="ghost" id="setupBack">戻る</button></div>
  <p class="err" id="setupErr" role="alert"></p>
</section>

<section id="battle" hidden>
  <div class="bars"><div id="meBar"></div><div id="oppBar"></div></div>
  <div id="theme" class="theme" hidden></div>
  <div id="stage"></div>
  <div id="arena" class="arena" hidden>
    <div id="meCard"></div>
    <div class="chatwrap"><div id="log" class="log" aria-live="polite"></div><div id="ctl" class="ctl"></div></div>
    <div id="oppCard"></div>
  </div>
  <p class="status" id="conn" role="status"></p>
  <div class="row"><button class="ghost sm" id="leave">場を去る</button></div>
</section>

<section id="coll" hidden>
  <h2>名乗り図鑑</h2>
  <div class="row"><button class="ghost" id="collBack">戻る</button></div>
  <div class="grid" id="collList"></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(v==null||v===false)continue;if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}e.append(...k.flat().filter(c=>c!=null));return e};
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
// 接続ID。タブごとに別（再読み込みでは維持）
const pid=(()=>{try{let v=sessionStorage.getItem('pid');if(!v){v=crypto.randomUUID();sessionStorage.setItem('pid',v)}return v}catch{return crypto.randomUUID()}})();
const NAMES=['太郎','ジェニファー','花子','ボブ','ミケ','マイケル','ポチ','アンジェリーナ','田中','ジョン','たまこ','ジェームス','さくら','ゴンザレス'];
const rndName=()=>NAMES[Math.floor(Math.random()*NAMES.length)];
if(!LS.get('name',''))LS.set('name',rndName());
const getName=()=>LS.get('name','')||'ななしさん';
const stag=p=>[...p.children].forEach((c,i)=>c.style.setProperty('--i',i));
const show=id=>{
  ['home','settings','setup','battle','coll'].forEach(s=>$('#'+s).hidden=s!==id);
  if(id==='home')$('#homeName').textContent=getName();
  if(id==='settings')$('#name').value=getName();
  stag($('#'+id));
};
const stage=(...k)=>{const s=$('#stage');s.replaceChildren(...k);stag(s)};
const wait_=t=>el('p',{class:'status wait'},t);

/* ---- 画面遷移 ---- */
$('#goSetup').onclick=()=>{$('#setupErr').textContent='';show('setup')};
$('#setupBack').onclick=()=>show('home');
$('#goColl').onclick=()=>{drawColl();show('coll')};
$('#collBack').onclick=()=>show('home');
$('#goSettings').onclick=()=>show('settings');
$('#rand').onclick=()=>{$('#name').value=rndName()};
$('#saveName').onclick=()=>{LS.set('name',$('#name').value.trim()||rndName());show('home')};
$('#create').onclick=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';connect(Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join(''))};
$('#join').onclick=()=>{const c=$('#joinCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<4)return $('#setupErr').textContent='合言葉は4文字以上で入力してください';connect(c)};
$('#leave').onclick=()=>leave();
const q=new URLSearchParams(location.search).get('room');
if(q){$('#joinCode').value=q.toUpperCase();show('setup')}else show('home');

/* ---- 通信 ---- */
let ws,code,S=null,pending=null,anim=false,skip=false,leaving=false,retry=0,myCard='',builtKey='',names={me:'',opp:''},shown={me:0,opp:0},lastKey='';
function connect(c){code=c;leaving=false;S=null;pending=null;anim=false;myCard='';builtKey='';lastKey='';shown={me:0,opp:0};showArena(false);$('#theme').hidden=true;drawBars();stage(wait_('つながっています…'));show('battle');open()}
function open(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/'+code);
  ws.onopen=()=>{retry=0;$('#conn').textContent='';send({type:'join',pid,name:getName()})};
  ws.onmessage=e=>handle(JSON.parse(e.data));
  ws.onclose=()=>{if(leaving)return;$('#conn').textContent='接続が切れました。つなぎ直しています…';setTimeout(open,Math.min(1000*2**retry++,8000))};
}
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function leave(){leaving=true;ws&&ws.close();history.replaceState(null,'',location.pathname);show('home')}
function handle(m){
  if(m.type==='error'){
    if(m.code==='full'){leave();$('#setupErr').textContent=m.message;show('setup')}
    else $('#conn').textContent=m.message;
  }else if(m.type==='replaced'){leave();$('#setupErr').textContent='同じIDで別の接続があったため、このタブは切断されました';show('setup')}
  else if(m.type==='state'){anim?pending=m:apply(m)}
  else if(m.type==='result')playResult(m);
}

/* ---- 描画 ---- */
function stars(n,t,prev){
  const s=el('span',{class:'st','aria-label':`★${n}個`});
  for(let i=0;i<t;i++)s.append(el('i',{class:i<n&&i>=prev?'new':''},i<n?'★':'☆'));
  return s;
}
function drawBars(me,opp,t=3){
  const m=S?S.me.name:'あなた',o=S&&S.opponent?S.opponent.name:'あいて';
  $('#meBar').replaceChildren(...(me==null?[]:[el('div',{},m),stars(me,t,shown.me)]));
  $('#oppBar').replaceChildren(...(opp==null?[]:[el('div',{},o),stars(opp,t,shown.opp)]));
  if(me!=null){shown.me=me;shown.opp=opp}
}
function setTheme(t){const e=$('#theme');if(e.textContent!==(t||'')||e.hidden){e.hidden=!t;e.textContent=t||'';e.style.animation='none';e.offsetWidth;e.style.animation=''}}
const nmEl=(name,c,meta)=>el('article',{class:'nm'+(c.weak?' weak':'')},
  el('h3',{},name),el('p',{},c.description),
  el('dl',{class:'params'},c.params.flatMap(p=>[el('dt',{},p.label),el('dd',{},p.value)])),
  c.weak?el('p',{class:'note'},'名乗りが小さすぎて、ふつうのなにかになりました'):null,
  meta?el('p',{class:'meta'},meta):null);
const oppText=s=>s.opponent?(s.opponent.submitted?`${s.opponent.name}は名乗りを決めた！`:`${s.opponent.name}は名乗りを考え中…`):'';
function apply(s){
  S=s;
  drawBars(s.me.stars,s.opponent?s.opponent.stars:0,s.starsToWin);
  $('#conn').textContent=s.opponent&&!s.opponent.connected?`${s.opponent.name}の接続が切れています`:'';
  const key=[s.phase,s.turn,s.me.submitted,s.me.rematch,s.battleReady,s.me.started].join();
  if(s.phase!=='reveal'){showArena(false);builtKey=''}
  if(['naming','judging','reveal'].includes(s.phase))setTheme(s.theme);else if(s.phase!=='finished')setTheme(null);
  if(key===lastKey){const o=$('#oppStat');if(o)o.textContent=oppText(s);return}
  lastKey=key;
  if(s.phase==='lobby'){
    const link=`${location.origin}/?room=${code}`;
    const cp=el('button',{class:'ghost',onclick:async()=>{try{await navigator.clipboard.writeText(link);cp.textContent='コピーしたよ！'}catch{cp.textContent=link}}},'招待リンクをコピー');
    stage(el('p',{class:'status'},'この合言葉を友だちに伝えよう'),el('div',{class:'code'},code),el('div',{class:'row',style:'justify-content:center'},cp),wait_('名乗り合う相手を待っています'));
  }else if(s.phase==='theming'){
    stage(wait_('天の声がお題を考えています'));
  }else if(s.phase==='naming'){
    if(s.me.submitted){
      stage(el('p',{class:'shout'},'名乗った！'),el('p',{class:'status'},`「${myCard}」と名乗りました`),wait_('天の声が名乗りを見定めています'),el('p',{class:'status',id:'oppStat'},oppText(s)));
    }else{
      const inp=el('input',{id:'cardName',maxlength:'20',placeholder:'われこそは……（20文字まで）',autocomplete:'off','aria-label':'名乗り'});
      const go=()=>{const v=inp.value.trim();if(!v||btn.disabled)return;myCard=v;send({type:'submit',cardName:v});btn.disabled=true};
      const btn=el('button',{class:'pri',onclick:go},'名乗る！');
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)go()});
      stage(el('p',{class:'shout'},'名乗れ！'),el('p',{class:'status'},'お題にふさわしい名を、堂々と。'),inp,el('div',{class:'row',style:'justify-content:center'},btn),el('p',{class:'status',id:'oppStat'},oppText(s)));
      inp.focus();
    }
  }else if(s.phase==='judging'){
    stage(el('div',{class:'grid'},el('div',{class:'nm back'},'？'),el('div',{class:'nm back'},'？')),wait_('天の声が名乗りの正体を見破っています'));
  }else if(s.phase==='reveal'){
    const k=s.turn+':'+s.cards.me.cardName+':'+s.cards.opponent.cardName;
    if(builtKey!==k){builtKey=k;buildArena(s.cards)}
    if(!s.battleReady)ctl(wait_('天の声が勝負を語っています。名乗りを読んで待とう'));
    else if(!s.me.started)ctl(el('button',{class:'pri',onclick:e=>{e.target.disabled=true;send({type:'start'})}},'いざ、勝負！'));
    else ctl(wait_('相手の覚悟を待っています'));
  }else if(s.phase==='finished'){
    const w=s.youWonGame;
    stage(el('div',{class:'verdict'+(w?'':' lose')},w?'名乗り王はあなただ！おめでとう！':'名乗り負け…出直そう！'),
      el('div',{class:'row',style:'justify-content:center'},el('button',{class:'pri',disabled:s.me.rematch?'':null,onclick:()=>send({type:'rematch'})},s.me.rematch?'相手を待っています…':'もう一度名乗り合う'),el('button',{class:'ghost',onclick:leave},'ホームへ')));
  }
}

const wait=ms=>new Promise(r=>{const t=Date.now(),i=setInterval(()=>{if(skip||Date.now()-t>=ms){clearInterval(i);r()}},80)});
function showArena(on){$('#arena').hidden=!on;$('#stage').hidden=on;if(on)stag($('#arena'))}
const ctl=(...k)=>{const c=$('#ctl');c.replaceChildren(...k);stag(c)};
function buildArena(c){
  const mn=S?S.me.name:'あなた',on=S&&S.opponent?S.opponent.name:'あいて';
  names={me:c.me.cardName,opp:c.opponent.cardName};
  $('#meCard').replaceChildren(el('p',{class:'who'},`${mn}の名乗り`),nmEl(c.me.cardName,c.me.card));
  $('#oppCard').replaceChildren(el('p',{class:'who'},`${on}の名乗り`),nmEl(c.opponent.cardName,c.opponent.card));
  $('#log').replaceChildren();
  showArena(true);
}
function addMsg(l){
  const log=$('#log');
  log.append(el('div',{class:'msg '+l.side},l.side==='n'?null:el('small',{},l.side==='me'?names.me:names.opp),l.text));
  log.scrollTop=log.scrollHeight; // 下に流れる。スクロール不要
}
async function playResult(m){
  anim=true;skip=false;lastKey='';
  setTheme(m.theme);
  if($('#arena').hidden)buildArena({me:m.me,opponent:m.opponent});
  $('#log').replaceChildren();
  ctl(el('button',{class:'ghost sm',onclick:()=>skip=true},'スキップ'));
  await wait(700);
  for(const l of m.log){addMsg(l);await wait(1800)}
  ctl(el('div',{class:'verdict'+(m.youWon?'':' lose')},m.youWon?'あなたの名乗りの勝ち！ ★ゲット！':'あいての名乗りの勝ち…'),
    el('button',{class:'pri',onclick:()=>{
      anim=false;const p=pending;pending=null;
      if(p)apply(p);else if(m.gameOver)apply({...S,phase:'finished',youWonGame:m.youWon,me:{...S.me,rematch:false}});else apply(S);
    }},m.gameOver?'結果へ':'次の名乗りへ'));
  drawBars(m.stars.me,m.stars.opponent);
  saveCard(m);
}

/* ---- 名乗り図鑑（localStorage） ---- */
function saveCard(m){
  const c=m.me.card,all=LS.get('cards',[]);
  all.unshift({id:Date.now()+Math.random().toString(36).slice(2,6),name:m.me.cardName,description:c.description,params:c.params,weak:!!c.weak,theme:m.theme,won:m.youWon});
  LS.set('cards',all.slice(0,200));
}
function drawColl(){
  const all=LS.get('cards',[]),g=$('#collList');
  g.replaceChildren(...(all.length?all.map(c=>{
    const e=nmEl(c.name,c,`お題「${c.theme}」で${c.won?'勝利':'敗北'}`);
    e.append(el('button',{class:'ghost sm',onclick:()=>{LS.set('cards',LS.get('cards',[]).filter(x=>x.id!==c.id));drawColl()}},'消す'));
    return e;
  }):[el('p',{class:'status'},'まだ名乗っていません。名乗り合うと、ここに集まります。')]));
  stag(g);
}
</script>
