<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFE66D">
<title>ナノリアイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#68D8F5;--sun:#FFE66D;--pink:#FF8FB8;--lime:#B7F28B;--ink:#282638;--paper:#FFFBEA;--mute:#46425f;--line:3px solid var(--ink);--disp:"Dela Gothic One","Zen Maru Gothic",sans-serif;--boing:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--sun);color:var(--ink);font:700 20px/1.7 "Zen Maru Gothic",sans-serif;min-height:100vh;overflow-x:hidden}
main{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:20px 16px 64px}
#home,#setup,#coll,#settings,#stage{max-width:580px;margin-inline:auto}
[hidden]{display:none!important}
:focus-visible{outline:var(--line);outline-offset:3px}

/* ---- 縁取りは太いフォント（Dela Gothic One）の文字だけ。本文（Zen Maru Gothic）には付けない ---- */
h2,.nm h3,.logo span,.theme,.verdict,.shout,.code{-webkit-text-stroke:.1em #fff;paint-order:stroke fill}
.shout,.code{color:#fff;-webkit-text-stroke:.14em var(--ink);filter:drop-shadow(4px 4px 0 var(--pink));text-align:center} /* 影は文字全体にかかる drop-shadow（縁取りとの前後関係がブラウザで変わらない） */
.st,.wait::before{-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill} /* 記号（★と●）は色が淡いので墨フチ */

/* ---- 背景：回りながら上へ昇る図形 ---- */
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg .sh{position:absolute;bottom:-18vmin;opacity:.92;will-change:transform;animation:rise linear infinite}
#bg svg{display:block;width:100%;height:100%;animation:spin linear infinite}
@keyframes rise{to{transform:translateY(-140vh)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- ポップなアニメーション ---- */
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}55%{transform:scale(1.12) rotate(2deg);opacity:1}78%{transform:scale(.96)}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
@keyframes slam{0%{transform:translateY(-70px) scale(1.5) rotate(-5deg);opacity:0}60%{transform:translateY(8px) rotate(-1deg);opacity:1}80%{transform:translateY(-3px) rotate(-1deg)}100%{transform:rotate(-1deg)}}
@keyframes starpop{0%{transform:scale(1)}35%{transform:scale(2.2) rotate(30deg)}70%{transform:scale(.8) rotate(-10deg)}100%{transform:scale(1)}}
@keyframes don{0%{transform:scale(3.2) rotate(-3deg);opacity:0}55%{transform:scale(.9) rotate(-1deg);opacity:1}75%{transform:scale(1.06) rotate(-1deg)}100%{transform:scale(1) rotate(-1deg)}}
@keyframes slideL{0%{transform:translateX(-120%) rotate(-8deg);opacity:0}65%{transform:translateX(6%) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes slideR{0%{transform:translateX(120%) rotate(8deg);opacity:0}65%{transform:translateX(-6%) rotate(-2deg);opacity:1}100%{transform:none}}
@keyframes cute{0%{transform:scale(.2) translateY(16px) rotate(-6deg);opacity:0}55%{transform:scale(1.14) rotate(3deg);opacity:1}80%{transform:scale(.97)}100%{transform:none}}
:where(section:not([hidden])>*,#stage>*,#arena>*,#ctl>*,.grid>*){animation:pop .5s backwards;animation-delay:calc(var(--i,0)*.07s)}

/* ---- 部品 ---- */
h2{font:400 2.1rem/1.3 var(--disp);margin:8px 0 14px}
button{font:inherit;font-size:1.1rem;color:var(--ink);background:var(--sky);border:var(--line);border-radius:999px;padding:10px 26px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .2s var(--boing),box-shadow .2s}
button:hover{transform:rotate(-2.5deg) scale(1.07);box-shadow:6px 6px 0 var(--ink)}
button:active{transform:translate(3px,3px) scale(.97);box-shadow:1px 1px 0 var(--ink)}
button.pri{background:var(--pink)}
button.ghost{background:var(--lime)}
button.sm{padding:3px 16px;font-size:.95rem;box-shadow:3px 3px 0 var(--ink)}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;font-size:1.2rem;width:100%;padding:12px 14px;border:var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--pink);height:32px}
label{display:block;margin:16px 0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.status{text-align:center;margin:16px 0}
.wait::before{content:"●●●";display:block;letter-spacing:.4em;color:var(--pink);animation:bob 1s infinite}
.err{color:#b3123a;min-height:1.7em}

/* ---- ホーム ---- */
.logo{display:flex;justify-content:center;gap:8px;margin:32px 0 12px}
.logo span{width:clamp(62px,18vw,104px);aspect-ratio:1;display:grid;place-items:center;font:400 clamp(2.3rem,11vw,4.2rem) var(--disp);border:var(--line);border-radius:50% 50% 50% 12%;box-shadow:4px 4px 0 var(--ink);background:var(--sky)}
.logo span:nth-child(1){transform:rotate(-6deg)}
.logo span:nth-child(2){background:var(--pink);transform:rotate(4deg)}
.logo span:nth-child(3){background:var(--lime);transform:rotate(-3deg)}
.logo span:nth-child(4){transform:rotate(5deg)}
.logo span:nth-child(5){background:var(--pink);transform:rotate(-4deg)}
.lead{text-align:center;margin:20px 0;padding:16px 20px;font-size:1.1rem;background:rgba(255,255,255,.78);border-radius:12px}
.lead:first-of-type{margin-top:112px}
.lead:last-of-type{margin-bottom:112px}

/* ---- 名乗り（正体）パネル ---- */
.nm{background:var(--sky);border:var(--line);border-radius:30px 30px 30px 8px;padding:18px;box-shadow:5px 5px 0 var(--ink)}
.nm.weak{background:#dcd9ea;border-style:dashed}
#meCard .nm:not(.weak){background:var(--lime)}
#oppCard .nm:not(.weak){background:var(--pink)}
.nm h3{margin:0 0 8px;font:400 1.95rem/1.35 var(--disp);overflow-wrap:anywhere}
.nm p{margin:0 0 12px;font-size:1.3rem;line-height:1.75}
.nm .note,.nm .meta{color:var(--mute);font-size:.95rem}
.nm .meta{margin:10px 0 0}
.params{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:0;font-size:1.15rem}
.params dt{color:var(--mute)}
.params dd{margin:0;text-align:right}

/* ---- バトル ---- */
.bars{display:flex;justify-content:space-between;gap:8px;font-size:1.1rem}
.bars div:last-child{text-align:right}
.st{letter-spacing:.12em;font-size:1.5rem;color:var(--pink)}
.st i{font-style:normal;display:inline-block}
.st i.off{color:#fff}
.st i.new{animation:starpop .8s .3s backwards}
.theme{background:var(--sky);border:var(--line);padding:14px 18px;text-align:center;font:400 clamp(1.9rem,8.5vw,3rem)/1.35 var(--disp);transform:rotate(-1deg);margin:14px auto;max-width:760px;animation:don .8s backwards;border-radius:8px 24px 8px 24px;box-shadow:5px 5px 0 var(--ink)}
.shout{font:400 clamp(2.6rem,11vw,3.8rem)/1.2 var(--disp);margin:10px 0 4px}
.code{font:400 2.8rem var(--disp);letter-spacing:.2em;margin:8px 0}
.arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:8px}
#meCard{animation:slideL .65s var(--boing) backwards}
#oppCard{animation:slideR .65s var(--boing) backwards}
.chatwrap{display:flex;flex-direction:column;gap:10px}
.log{height:min(64vh,560px);overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:10px;padding:12px;background:rgba(255,255,255,.4);border:var(--line);border-radius:20px}
.log::-webkit-scrollbar{display:none}
.log>:first-child{margin-top:auto}
.msg{max-width:88%;padding:8px 14px;border:var(--line);border-radius:20px;font-size:1.25rem;line-height:1.65;animation:cute .45s backwards;overflow-wrap:anywhere}
.msg small{display:block;font-size:.8rem;color:var(--mute);line-height:1.4}
.msg.me{transform-origin:left bottom;align-self:flex-start;background:var(--lime);border-bottom-left-radius:4px}
.msg.opp{transform-origin:right bottom;align-self:flex-end;background:var(--pink);border-bottom-right-radius:4px}
.msg.n{align-self:center;background:var(--sky);border-style:dashed;font-size:1.1rem;text-align:center}
.ctl{display:flex;flex-direction:column;align-items:center;gap:12px}
.verdict{font:400 1.9rem/1.4 var(--disp);text-align:center;padding:14px;border:var(--line);background:var(--lime);margin:16px 0;border-radius:24px;animation:slam .7s backwards;box-shadow:5px 5px 0 var(--ink)}
.verdict.lose{background:var(--pink)}
.ctl .verdict{width:100%;margin:0}

/* ---- 結果・図鑑 ---- */
.grid{display:grid;gap:20px;margin-top:16px}
.hist{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}
.hist li{background:var(--sky);border:var(--line);border-radius:16px;padding:8px 16px;line-height:1.5;box-shadow:3px 3px 0 var(--ink)}
.hist li:nth-child(even){background:var(--lime)}
.hist small{display:block;color:var(--mute);font-size:.9rem}
.hist .w,.hist .l{border:2px solid var(--ink);border-radius:999px;padding:0 10px}
.hist .w{background:var(--pink)}
.hist .l{background:#dcd9ea}

@media(max-width:900px){.arena{grid-template-columns:1fr 1fr}.chatwrap{grid-column:1/-1;order:3}}
/* ---- ミュートボタン（PC・スマホとも右上に常時固定） ---- */
#mute{position:fixed;bottom:10px;left:10px;z-index:20;width:44px;height:44px;min-height:0;padding:0;display:grid;place-items:center;font-size:1.3rem;line-height:1;border-radius:50%;background:var(--paper);box-shadow:3px 3px 0 var(--ink)}
#mute[aria-pressed=true]{background:var(--pink)}
@media(hover:none) and (pointer:coarse){#volBox{display:none}} /* タッチ端末は音量スライダーを隠す（端末の音量ボタンを使う） */

/* ================= スマホ（幅600px以下）だけの調整。PC表示には影響しない ================= */
@media(max-width:600px){
  body{font-size:17px}
  main{padding:16px 12px 64px}
  h2{font-size:1.7rem;margin:4px 0 10px}
  button{min-height:44px;padding:8px 20px;font-size:1rem}
  button.sm{min-height:36px;padding:2px 14px;font-size:.9rem}
  label{margin:12px 0 4px}
  .row{gap:10px;margin:14px 0}
  .status{margin:10px 0}
  .logo{margin:24px 0 20px}
  .lead{margin:12px 0;padding:12px 14px;font-size:1rem}
  .lead:first-of-type{margin-top:72px}
  .lead:last-of-type{margin-bottom:88px}
  .shout{font-size:clamp(2rem,10vw,2.8rem)}
  .code{font-size:2.2rem}
  .verdict{font-size:1.15rem;padding:8px 10px;margin:8px 0;border-width:2px;border-radius:16px;box-shadow:3px 3px 0 var(--ink)}
  /* 図鑑などの名乗りカード */
  .nm{padding:14px}
  .nm h3{font-size:1.5rem}
  .nm p{font-size:1.05rem}
  .params{font-size:1rem}

  /* ---- バトル画面 ---- */
  .bars{font-size:.85rem;line-height:1.4;gap:6px}
  .st{font-size:1.1rem}
  .theme{font-size:clamp(1.3rem,6.2vw,1.8rem);padding:6px 12px;margin:8px auto;border-width:2px;box-shadow:3px 3px 0 var(--ink)}
  #battle .row{margin:6px 0}
  #stage .row{margin:22px 0 10px}
  #conn{margin:2px 0;font-size:.85rem}
  /* 縦並び：上から 相手・ログ・自分 */
  .arena{display:flex;flex-direction:column;align-items:stretch;gap:8px;margin-top:4px}
  #oppCard{order:1}
  .chatwrap{grid-column:auto;order:2;gap:6px}
  #meCard{order:3}
  /* 名乗りカード：左に説明文、右にパラメータの2列 */
  .arena .nm{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:2px 10px;align-items:start;padding:8px 12px;border-width:2px;border-radius:18px 18px 18px 6px;box-shadow:3px 3px 0 var(--ink)}
  .arena .nm h3{grid-column:1/-1;margin:0 0 2px;font-size:1.6rem;line-height:1.3}
  .arena .nm p{margin:0;font-size:.8rem;line-height:1.5}
  .arena .nm .params{font-size:.78rem;line-height:1.45;gap:1px 8px}
  .arena .nm .note{grid-column:1/-1;font-size:.7rem;margin:2px 0 0}
  /* ログ：約10行ぶんの高さ（変えたいときは height だけ） */
  .log{height:17rem;padding:6px 8px;gap:6px;border-width:2px;border-radius:14px}
  .msg{max-width:92%;padding:3px 10px;border-width:2px;border-radius:14px;font-size:.9rem;line-height:1.5}
  .msg.n{font-size:.85rem}
  .ctl{gap:6px}
}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<button id="mute" type="button" aria-label="BGMをミュート" aria-pressed="false">🔊</button>
<main>
<section id="home">
  <div class="logo" aria-label="ナノリアイ"><span>ナ</span><span>ノ</span><span>リ</span><span>ア</span><span>イ</span></div>
  <p class="lead">われこそは、と名乗れ。名前の力で勝負が決まる。<br>先に星を3つ集めた者が、名乗り王だ！</p>
  <p class="lead">いまの名前：<b id="homeName"></b></p>
  <div class="row" style="justify-content:center"><button class="pri" id="goSetup">名乗り合う！</button><button class="ghost" id="goColl">名乗り図鑑</button><button id="goSettings">設定</button></div>
</section>

<section id="settings" hidden>
  <h2>設定</h2>
  <label for="name">あなたの名前（相手にも見えます）</label>
  <input id="name" maxlength="12" autocomplete="off">
  <div id="volBox">
    <label for="vol">BGMの音量：<b id="volNum"></b></label>
    <input id="vol" type="range" min="0" max="100" step="5">
  </div>
  <div class="row"><button class="ghost" id="rand">ランダムで決める</button><button class="pri" id="saveName">これでいく！</button></div>
</section>

<section id="setup" hidden>
  <h2>名乗り合いの場</h2>
  <div class="row"><button class="pri" id="create">場をひらく</button></div>
  <label for="joinCode">友だちの合言葉で場に入る</label>
  <input id="joinCode" maxlength="8" placeholder="例: K7M2" autocomplete="off" style="text-transform:uppercase">
  <div class="row"><button id="join">この場に入る</button><button class="ghost" id="setupBack">戻る</button></div>
  <p class="err" id="setupErr" role="alert"></p>
</section>

<section id="battle" hidden>
  <div class="bars"><div id="meBar"></div><div id="oppBar"></div></div>
  <div id="theme" class="theme" hidden></div>
  <p id="themeNote" class="status" hidden></p>
  <div id="stage"></div>
  <div id="arena" class="arena" hidden>
    <div id="meCard"></div>
    <div class="chatwrap"><div id="log" class="log" aria-live="polite"></div><div id="ctl" class="ctl"></div></div>
    <div id="oppCard"></div>
  </div>
  <p class="status" id="conn" role="status"></p>
  <div class="row" id="leaveRow"><button class="ghost sm" id="leave">場を去る</button></div>
</section>

<section id="coll" hidden>
  <h2>名乗り図鑑</h2>
  <div class="row"><button class="ghost" id="collBack">戻る</button></div>
  <div class="grid" id="collList"></div>
</section>
</main>

<script>
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(v==null||v===false)continue;if(x==='class')e.className=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}e.append(...k.flat().filter(c=>c!=null));return e};
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
// 接続ID。タブごとに別（再読み込みでは維持）
const pid=(()=>{try{let v=sessionStorage.getItem('pid');if(!v){v=crypto.randomUUID();sessionStorage.setItem('pid',v)}return v}catch{return crypto.randomUUID()}})();
const NAMES=['太郎','ジェニファー','花子','ボブ','ミケ','マイケル','ポチ','アンジェリーナ','田中','ジョン','たまこ','ジェームス','さくら','ゴンザレス'];
const rndName=()=>NAMES[Math.floor(Math.random()*NAMES.length)];
if(!LS.get('name',''))LS.set('name',rndName());
const getName=()=>LS.get('name','')||'ななしさん';
const stag=p=>[...p.children].forEach((c,i)=>c.style.setProperty('--i',i));
const show=id=>{
  ['home','settings','setup','battle','coll'].forEach(s=>$('#'+s).hidden=s!==id);
  if(id==='home')$('#homeName').textContent=getName();
  if(id==='settings'){$('#name').value=getName();$('#vol').value=LS.get('vol',15);$('#volNum').textContent=LS.get('vol',15)}
  stag($('#'+id));
};
const stage=(...k)=>{const s=$('#stage');s.replaceChildren(...k);stag(s)};
const wait_=t=>el('p',{class:'status wait'},t);

/* ---- 文言バリエーション（すべてランダム表示） ---- */
const TXT={
connecting:['つながっています…','天の声に電話をかけています…','名乗り合いの場へ向かっています…','雲をかきわけて進んでいます…','空の上とつながっています…','太鼓の準備をしています…','天の声がマイクの電源を入れています…','通信の神様にお願いしています…','名乗りの花道を掃除しています…','ただいま参ります、少々お待ちを…'],
lobby:['名乗り合う相手を待っています','まだ見ぬライバルの到着を待っています','空席がひとつ。誰かの名乗りを待っています','土俵に塩をまいて待っています','座布団を温めて待っています','合言葉を知る者の到着を待っています','相手はまだ名乗りの練習中かもしれません','強そうな名前をひっさげた挑戦者を待っています','風のうわさでは、誰かが来るはず…','友だちが来るまで、少し素振りでもしておこう'],
theming:['天の声がお題を考えています','天の声がうんうん唸っています','天の声が辞書をめくっています','天の声が今日のお題をくじで引いています','お題が空から降ってくるのを待っています','天の声が咳払いをしました','天の声がお題を煮込んでいます','天の声が思いつきを捕まえようとしています','天の声がお題を決めかねています','天の声がお題をそっと磨いています'],
submitted:['名乗った！','堂々と名乗った！','言い切った！','名乗りを上げた！','世界に響いた！','もう後戻りはできない！','名乗ってしまった！','いい声だ！','名乗りが天に届いた！','名乗りの旗が立った！'],
judging:['天の声が名乗りの正体を見破っています','天の声が名乗りをじーっと見つめています','天の声が名乗りの裏側をのぞいています','天の声が虫眼鏡で名乗りの正体を調べています','天の声が名乗りに耳をすましています','天の声が名乗りの重さを量っています','天の声が名乗りをひっくり返して確かめています','天の声が名乗りの匂いをかいでいます','名乗りが姿をあらわそうとしています','天の声が鑑定のハンコを握りしめています'],
oppThinking:['{name}は名乗りを考え中…','{name}は腕組みして唸っている…','{name}は天井を見つめている…','{name}は名乗りを練り上げている…','{name}は深呼吸している…','{name}は口の中で名乗りを転がしている…','{name}はまだ決めかねている…','{name}は名乗りの最終調整中…'],
oppDone:['{name}は名乗りを決めた！','{name}は覚悟を決めた！','{name}の名乗りが固まった！','{name}は不敵に笑っている…','{name}は準備万端だ！','{name}は名乗りを胸に秘めた！','{name}はもう名乗りたくてうずうずしている！','{name}は腕を組んで待っている！'],
battleWait:['天の声が勝負を語っています。名乗りを読んで待とう','天の声が勝負の筋書きを練っています。相手の名乗りを読んで待とう','勝負の行方を天の声が占っています。名乗りを眺めて待とう','天の声が実況の準備中です。名乗りをじっくり読もう','戦いの幕を天の声が編んでいます。名乗りを味わって待とう','天の声が勝負をまとめています。ライバルの名乗りを読み込もう','天の声が息を吸い込みました。名乗りを読んで待とう','天の声が筆をとりました。名乗りを読みながら待とう','天の声が戦場に旗を立てています。名乗りをよく読もう','勝負の結末を天の声が寝かせています。名乗りを読んで待とう'],

shortCode:['合言葉は4文字以上で入力してください','合言葉が短すぎます。4文字以上でお願いします','合言葉はもう少し長いようです。4文字以上で！','呪文が足りません。4文字以上で唱えてください','合言葉が短くて心細そうです。4文字以上でお願いします']
};
const rpick=a=>a[Math.floor(Math.random()*a.length)];
// 同じ画面の間は文言を固定するため、抽選結果（番号）を覚えておく
let pc={};
const pk=(k,a)=>{if(!(k in pc))pc[k]=Math.floor(Math.random()*a.length);return a[pc[k]]};

/* ---- 背景：丸・バツ・ドットなどが、くるくる回りながらゆっくり上へ昇る ---- */
(()=>{
  const bg=$('#bg'),I='#282638';
  const COLORS=['#68D8F5','#FF8FB8','#B7F28B','#FFFFFF','#68D8F5','#FF8FB8','#B7F28B','#FFFFFF','#282638'];
  // 線で描く図形は、墨の太線の上に色の細線を重ねて縁取りする
  const line=(c,d)=>`<path d="${d}" fill="none" stroke="${I}" stroke-width="24" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${c}" stroke-width="11" stroke-linecap="round"/>`;
  const SHAPES=[
    c=>`<circle cx="50" cy="50" r="33" fill="none" stroke="${I}" stroke-width="24"/><circle cx="50" cy="50" r="33" fill="none" stroke="${c}" stroke-width="11"/>`, // 輪
    c=>`<circle cx="50" cy="50" r="36" fill="${c}" stroke="${I}" stroke-width="7"/>`, // 丸
    c=>line(c,'M24 24L76 76M76 24L24 76'), // バツ
    c=>line(c,'M50 20V80M20 50H80'), // プラス
    c=>`<polygon points="50,14 88,80 12,80" fill="${c}" stroke="${I}" stroke-width="7" stroke-linejoin="round"/>`, // 三角
    c=>`<rect x="18" y="18" width="64" height="64" rx="10" fill="${c}" stroke="${I}" stroke-width="7"/>`, // 四角
    c=>[[24,72],[50,50],[76,28]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="12" fill="${c}" stroke="${I}" stroke-width="6"/>`).join(''), // ドット
    c=>[[30,30],[70,30],[30,70],[70,70]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="10" fill="${c}" stroke="${I}" stroke-width="6"/>`).join('') // 四つ点
  ];
  const r=(a,b)=>a+Math.random()*(b-a);
  const n=innerWidth<600?14:26;
  for(let i=0;i<n;i++){
    const rise=r(26,52),spin=r(5,15),size=r(30,78);
    const d=document.createElement('div');
    d.className='sh';
    d.style.cssText=`left:${r(-2,98).toFixed(1)}%;width:${size.toFixed(0)}px;height:${size.toFixed(0)}px;animation-duration:${rise.toFixed(1)}s;animation-delay:-${(Math.random()*rise).toFixed(1)}s`;
    const color=COLORS[Math.floor(Math.random()*COLORS.length)];
    d.innerHTML=`<svg viewBox="0 0 100 100" style="animation-duration:${spin.toFixed(1)}s;animation-direction:${Math.random()<.5?'normal':'reverse'}">${SHAPES[i%SHAPES.length](color)}</svg>`;
    bg.append(d);
  }
})();

/* ---- BGM（2曲を順番にループ。最初のクリックで開始） ---- */
const bgm=['/bgm/bgm1.mp3','/bgm/bgm2.mp3'].map(u=>{const a=new Audio(u);a.preload='auto';return a});
// タッチ端末（スマホ・タブレット）は音量スライダーを隠し、端末側の音量ボタンに任せる（iOSは audio.volume が効かないため）
const touch=matchMedia('(hover:none) and (pointer:coarse)').matches;
const vol=()=>touch?1:Math.min(1,Math.max(0,LS.get('vol',15)/100));
let bgmOn=false;
const bgmVol=()=>bgm.forEach(a=>a.volume=vol());
function bgmNext(i){const a=bgm[i%bgm.length];a.currentTime=0;a.onended=()=>bgmNext(i+1);a.play().catch(()=>{bgmOn=false})}
function bgmStart(){if(bgmOn)return;bgmOn=true;bgmVol();bgmNext(0)}
['pointerdown','keydown'].forEach(e=>addEventListener(e,bgmStart));
bgmVol();
// ミュート（設定は保存。再生は止めず無音にするだけなので、解除するとすぐ戻る）
let muted=!!LS.get('mute',false);
function applyMute(){bgm.forEach(a=>a.muted=muted);const b=$('#mute');b.textContent=muted?'🔇':'🔊';b.setAttribute('aria-pressed',muted)}
$('#mute').onclick=()=>{muted=!muted;LS.set('mute',muted);applyMute()};
applyMute();

/* ---- 画面遷移 ---- */
$('#goSetup').onclick=()=>{$('#setupErr').textContent='';show('setup')};
$('#setupBack').onclick=()=>show('home');
$('#goColl').onclick=()=>{drawColl();show('coll')};
$('#collBack').onclick=()=>show('home');
$('#goSettings').onclick=()=>show('settings');
$('#vol').oninput=e=>{LS.set('vol',+e.target.value);$('#volNum').textContent=e.target.value;bgmVol()};
$('#rand').onclick=()=>{$('#name').value=rndName()};
$('#saveName').onclick=()=>{LS.set('name',$('#name').value.trim()||rndName());show('home')};
$('#create').onclick=()=>{const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';connect(Array.from({length:4},()=>c[Math.floor(Math.random()*c.length)]).join(''))};
$('#join').onclick=()=>{const c=$('#joinCode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<4)return $('#setupErr').textContent=rpick(TXT.shortCode);connect(c)};
$('#leave').onclick=()=>leave();
const q=new URLSearchParams(location.search).get('room');
if(q){$('#joinCode').value=q.toUpperCase();show('setup')}else show('home');

/* ---- 通信 ---- */
let ws,code,S=null,pending=null,anim=false,skip=false,leaving=false,retry=0,myCard='',builtKey='',names={me:'',opp:''},shown={me:0,opp:0},lastKey='';
function connect(c){code=c;leaving=false;S=null;pending=null;anim=false;myCard='';builtKey='';lastKey='';shown={me:0,opp:0};showArena(false);$('#theme').hidden=true;$('#themeNote').hidden=true;drawBars();pc={};stage(wait_(pk('conn',TXT.connecting)));show('battle');open()}
function open(){
  ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/'+code);
  ws.onopen=()=>{retry=0;$('#conn').textContent='';send({type:'join',pid,name:getName()})};
  ws.onmessage=e=>handle(JSON.parse(e.data));
  ws.onclose=()=>{if(leaving)return;$('#conn').textContent=rpick(TXT.disconnected);setTimeout(open,Math.min(1000*2**retry++,8000))};
}
const send=o=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function leave(){leaving=true;ws&&ws.close();history.replaceState(null,'',location.pathname);show('home')}
function handle(m){
  if(m.type==='error'){
    if(m.code==='full'){leave();$('#setupErr').textContent=m.message;show('setup')}
    else $('#conn').textContent=m.message;
  }else if(m.type==='replaced'){leave();$('#setupErr').textContent=rpick(TXT.replaced);show('setup')}
  else if(m.type==='state'){anim?pending=m:apply(m)}
  else if(m.type==='result')playResult(m);
}

/* ---- 描画 ---- */
function stars(n,t,prev){
  const s=el('span',{class:'st','aria-label':`★${n}個`});
  for(let i=0;i<t;i++)s.append(el('i',{class:i<n?(i>=prev?'new':''):'off'},i<n?'★':'☆'));
  return s;
}
function drawBars(me,opp,t=3){
  const m=S?S.me.name:'あなた',o=S&&S.opponent?S.opponent.name:'あいて';
  $('#meBar').replaceChildren(...(me==null?[]:[el('div',{},m),stars(me,t,shown.me)]));
  $('#oppBar').replaceChildren(...(opp==null?[]:[el('div',{},o),stars(opp,t,shown.opp)]));
  if(me!=null){shown.me=me;shown.opp=opp}
}
function setTheme(t){const e=$('#theme');if(e.textContent!==(t||'')||e.hidden){e.hidden=!t;e.textContent=t||'';e.style.animation='none';e.offsetWidth;e.style.animation=''}}
const nmEl=(name,c,meta)=>el('article',{class:'nm'+(c.weak?' weak':'')},
  el('h3',{},name),el('p',{},c.description),
  el('dl',{class:'params'},c.params.flatMap(p=>[el('dt',{},p.label),el('dd',{},p.value)])),
  c.weak?el('p',{class:'note'},rpick(TXT.weakNote)):null,
  meta?el('p',{class:'meta'},meta):null);
const oppText=s=>s.opponent?pk('opp'+s.turn+(s.opponent.submitted?'D':'T'),s.opponent.submitted?TXT.oppDone:TXT.oppThinking).replaceAll('{name}',s.opponent.name):'';
function apply(s){
  S=s;
  $('#leaveRow').hidden=s.phase==='finished';
  if(s.phase==='theming')pc={};
  drawBars(s.me.stars,s.opponent?s.opponent.stars:0,s.starsToWin);
  $('#conn').textContent=s.opponent&&!s.opponent.connected?`${s.opponent.name}の接続が切れています`:'';
  const key=[s.phase,s.turn,s.me.submitted,s.me.rematch,s.battleReady,s.me.started].join();
  if(s.phase!=='reveal'){showArena(false);builtKey=''}
  const hid=s.phase==='naming'&&(s.themeHidden||!s.theme); // 伏せられているお題は「？？？」で表示
  if(hid)setTheme('？？？');else if(['naming','judging','reveal'].includes(s.phase))setTheme(s.theme);else setTheme(null);
  const tn=$('#themeNote');tn.hidden=!(hid&&!s.me.submitted);tn.textContent=tn.hidden?'':pk('hid'+s.turn,TXT.hiddenNote);
  if(key===lastKey){const o=$('#oppStat');if(o)o.textContent=oppText(s);return}
  lastKey=key;
  if(s.phase==='lobby'){
    const link=`${location.origin}/?room=${code}`;
    const cp=el('button',{class:'ghost',onclick:async()=>{try{await navigator.clipboard.writeText(link);cp.textContent='コピーしたよ！'}catch{cp.textContent=link}}},'招待リンクをコピー');
    stage(el('p',{class:'status'},'この合言葉を友だちに伝えよう'),el('div',{class:'code'},code),el('div',{class:'row',style:'justify-content:center'},cp),wait_(pk('lobby',TXT.lobby)));
  }else if(s.phase==='theming'){
    stage(wait_(pk('theme'+s.turn,TXT.theming)));
  }else if(s.phase==='naming'){
    if(s.me.submitted){
      stage(el('p',{class:'shout'},pk('sub'+s.turn,TXT.submitted)),el('p',{class:'status'},`「${myCard}」と名乗りました`),wait_(pk('judge'+s.turn,TXT.judging)),el('p',{class:'status',id:'oppStat'},oppText(s)));
    }else{
      const inp=el('input',{id:'cardName',maxlength:'10',placeholder:'われこそは……（10文字まで）',autocomplete:'off','aria-label':'名乗り'});
      const go=()=>{const v=inp.value.trim();if(!v||btn.disabled)return;myCard=v;send({type:'submit',cardName:v});btn.disabled=true};
      const btn=el('button',{class:'pri',onclick:go},'名乗る！');
      inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)go()});
      stage(el('p',{class:'shout'},'名乗れ！'),el('p',{class:'status'},pk('guide'+s.turn,TXT.guide)),inp,el('div',{class:'row',style:'justify-content:center'},btn),el('p',{class:'status',id:'oppStat'},oppText(s)));
      inp.focus();
    }
  }else if(s.phase==='judging'){
    stage(wait_(pk('judge'+s.turn,TXT.judging)));
  }else if(s.phase==='reveal'){
    const k=s.turn+':'+s.cards.me.cardName+':'+s.cards.opponent.cardName;
    if(builtKey!==k){builtKey=k;buildArena(s.cards)}
    if(!s.battleReady)ctl(wait_(pk('battle'+s.turn,TXT.battleWait)));
    else if(!s.me.started)ctl(el('button',{class:'pri',onclick:e=>{e.target.disabled=true;send({type:'start'})}},'いざ、勝負！'));
    else ctl(wait_(pk('ready'+s.turn,TXT.readyWait)));
  }else if(s.phase==='finished'){
    const w=s.youWonGame;
    const hist=el('ol',{class:'hist'},(s.history||[]).map(h=>el('li',{},el('small',{},`第${h.turn}戦　${h.theme}`),`「${h.me}」 vs 「${h.opp}」　`,el('span',{class:h.youWon?'w':'l'},h.youWon?'勝ち':'負け'))));
    stage(el('div',{class:'verdict'+(w?'':' lose')},pk(w?'finW':'finL',w?TXT.gameWin:TXT.gameLose)),hist,
      el('div',{class:'row',style:'justify-content:center'},el('button',{class:'pri',disabled:s.me.rematch?'':null,onclick:()=>send({type:'rematch'})},s.me.rematch?'相手を待っています…':'もう一度名乗り合う'),el('button',{class:'ghost',onclick:leave},'ホームへ')));
  }
}

const wait=ms=>new Promise(r=>{const t=Date.now(),i=setInterval(()=>{if(skip||Date.now()-t>=ms){clearInterval(i);r()}},80)});
function showArena(on){$('#arena').hidden=!on;$('#stage').hidden=on;if(on)stag($('#arena'))}
const ctl=(...k)=>{const c=$('#ctl');c.replaceChildren(...k);stag(c)};
function buildArena(c){
  names={me:c.me.cardName,opp:c.opponent.cardName};
  $('#meCard').replaceChildren(nmEl(c.me.cardName,c.me.card));
  $('#oppCard').replaceChildren(nmEl(c.opponent.cardName,c.opponent.card));
  $('#log').replaceChildren();
  showArena(true);
}
function addMsg(l){
  const log=$('#log');
  const m=el('div',{class:'msg '+l.side},l.text);
  log.append(m);
  const pad=parseFloat(getComputedStyle(log).paddingBottom)||0;
  if(m.offsetHeight>log.clientHeight-pad*2){ // 表示領域より長い行（スマホ）：頭から読めるように合わせ、少し後に末尾へ流す
    log.scrollTop=log.scrollHeight-pad*2-m.offsetHeight;
    setTimeout(()=>log.scrollTo({top:log.scrollHeight,behavior:'smooth'}),1000);
  }else log.scrollTop=log.scrollHeight; // 下に流れる。スクロール不要
}
async function playResult(m){
  anim=true;skip=false;lastKey='';
  setTheme(m.theme);
  if($('#arena').hidden)buildArena({me:m.me,opponent:m.opponent});
  $('#log').replaceChildren();
  ctl(el('button',{class:'ghost sm',onclick:()=>skip=true},'スキップ'));
  await wait(700);
  for(const l of m.log){addMsg(l);await wait(1800)}
  ctl(el('div',{class:'verdict'+(m.youWon?'':' lose')},rpick(m.youWon?TXT.turnWin:TXT.turnLose)),
    el('button',{class:'pri',onclick:()=>{
      anim=false;const p=pending;pending=null;
      if(p)apply(p);else if(m.gameOver)apply({...S,phase:'finished',youWonGame:m.youWon,me:{...S.me,rematch:false}});else apply(S);
    }},m.gameOver?'結果へ':'次の名乗りへ'));
  drawBars(m.stars.me,m.stars.opponent);
  saveCard(m);
}

/* ---- 名乗り図鑑（localStorage） ---- */
function saveCard(m){
  const c=m.me.card,all=LS.get('cards',[]);
  all.unshift({id:Date.now()+Math.random().toString(36).slice(2,6),name:m.me.cardName,description:c.description,params:c.params,weak:!!c.weak,theme:m.theme,won:m.youWon});
  LS.set('cards',all.slice(0,200));
}
function drawColl(){
  const all=LS.get('cards',[]),g=$('#collList');
  g.replaceChildren(...(all.length?all.map(c=>{
    const e=nmEl(c.name,c,`お題「${c.theme}」で${c.won?'勝利':'敗北'}`);
    e.append(el('button',{class:'ghost sm',onclick:()=>{LS.set('cards',LS.get('cards',[]).filter(x=>x.id!==c.id));drawColl()}},'消す'));
    return e;
  }):[el('p',{class:'status'},rpick(TXT.collEmpty))]));
  stag(g);
}
</script>
