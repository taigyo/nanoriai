<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#FFE66D">
<title>ナノリアイ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#68D8F5;--sun:#FFE66D;--pink:#FF8FB8;--lime:#B7F28B;--ink:#282638;--paper:#FFFBEA;--mute:#46425f;--line:3px solid var(--ink);--disp:"Dela Gothic One","Zen Maru Gothic",sans-serif;--boing:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
body{margin:0;background:var(--sun);color:var(--ink);font:700 20px/1.7 "Zen Maru Gothic",sans-serif;min-height:100vh;overflow-x:hidden}
main{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:20px 16px 112px}
#home,#setup,#coll,#settings,#stage{max-width:680px;margin-inline:auto}
[hidden]{display:none!important}
:focus-visible{outline:var(--line);outline-offset:3px}

/* ---- 縁取りは太いフォント（Dela Gothic One）の文字だけ。本文（Zen Maru Gothic）には付けない ---- */
h2,.nm h3,.logo span,.theme,.verdict,.shout,.code,.vsn{-webkit-text-stroke:.1em #fff;paint-order:stroke fill}
.shout,.code{color:#fff;-webkit-text-stroke:.14em var(--ink);filter:drop-shadow(4px 4px 0 var(--pink));text-align:center} /* 影は文字全体にかかる drop-shadow（縁取りとの前後関係がブラウザで変わらない） */
.st,.wait::before{-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill} /* 記号（★と●）は色が淡いので墨フチ */

/* ---- 背景：回りながら上へ昇る図形 ---- */
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg .sh{position:absolute;bottom:-18vmin;opacity:.92;will-change:transform;animation:rise linear infinite}
#bg svg{display:block;width:100%;height:100%;animation:spin linear infinite}
@keyframes rise{to{transform:translateY(-140vh)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- ポップなアニメーション ---- */
@keyframes pop{0%{transform:scale(.3) rotate(-8deg);opacity:0}55%{transform:scale(1.12) rotate(2deg);opacity:1}78%{transform:scale(.96)}100%{transform:none;opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-9px)}}
@keyframes slam{0%{transform:translateY(-70px) scale(1.5) rotate(-5deg);opacity:0}60%{transform:translateY(8px) rotate(-1deg);opacity:1}80%{transform:translateY(-3px) rotate(-1deg)}100%{transform:rotate(-1deg)}}
@keyframes starpop{0%{transform:scale(1)}35%{transform:scale(2.2) rotate(30deg)}70%{transform:scale(.8) rotate(-10deg)}100%{transform:scale(1)}}
@keyframes don{0%{transform:scale(3.2) rotate(-3deg);opacity:0}55%{transform:scale(.9) rotate(-1deg);opacity:1}75%{transform:scale(1.06) rotate(-1deg)}100%{transform:scale(1) rotate(-1deg)}}
@keyframes slideL{0%{transform:translateX(-120%) rotate(-8deg);opacity:0}65%{transform:translateX(6%) rotate(2deg);opacity:1}100%{transform:none}}
@keyframes slideR{0%{transform:translateX(120%) rotate(8deg);opacity:0}65%{transform:translateX(-6%) rotate(-2deg);opacity:1}100%{transform:none}}
:where(section:not([hidden])>*,#stage>*,#arena>*,#ctl>*,.grid>*){animation:pop .5s backwards;animation-delay:calc(var(--i,0)*.07s)}

/* ---- 部品 ---- */
h2{font:400 2.1rem/1.3 var(--disp);margin:8px 0 14px}
button{font:inherit;font-size:1.1rem;color:var(--ink);background:var(--sky);border:var(--line);border-radius:999px;padding:10px 26px;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .2s var(--boing),box-shadow .2s}
button:hover{transform:rotate(-2.5deg) scale(1.07);box-shadow:6px 6px 0 var(--ink)}
button:active{transform:translate(3px,3px) scale(.97);box-shadow:1px 1px 0 var(--ink)}
button.pri{background:var(--pink)}
button.ghost{background:var(--lime)}
button.sm{padding:3px 16px;font-size:.95rem;box-shadow:3px 3px 0 var(--ink)}
button:disabled{opacity:.5;cursor:default}
input{font:inherit;font-size:1.2rem;width:100%;padding:12px 14px;border:var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--pink);height:32px}
label{display:block;margin:16px 0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.status{text-align:center;margin:16px 0}
.wait::before{content:"●●●";display:block;letter-spacing:.4em;color:var(--pink);animation:bob 1s infinite}
.err{color:#b3123a;min-height:1.7em}

/* ---- ホーム ---- */
.logo{display:flex;justify-content:center;gap:15px;margin:32px 0 12px}
.logo span{width:clamp(62px,18vw,104px);aspect-ratio:1;display:grid;place-items:center;font:400 clamp(2.3rem,11vw,4.2rem) var(--disp);border:var(--line);border-radius:50% 50% 50% 12%;box-shadow:4px 4px 0 var(--ink);background:var(--sky)}
.logo span:nth-child(1){transform:rotate(-6deg)}
.logo span:nth-child(2){background:var(--pink);transform:rotate(4deg)}
.logo span:nth-child(3){background:var(--lime);transform:rotate(-3deg)}
.logo span:nth-child(4){transform:rotate(5deg)}
.logo span:nth-child(5){background:var(--pink);transform:rotate(-4deg)}
.lead{text-align:center;margin:20px 0;padding:16px 20px;font-size:1.1rem;}
.lead_explain{margin-top:112px;background:rgba(255,255,255,.78);border-radius:12px}

/* ---- ホーム画面の名札（いまの名前）----
   .nametag = 名札全体 / __label = 上の帯（「いまの名前」）/ __name = 名前の欄。左上の丸は安全ピンの穴
   表示のたびにゆらっと揺れる（nametag-swing）。下の余白は、ボタンとの間をあける量 */
.nametag{position:relative;width:fit-content;min-width:min(260px,100%);max-width:100%;margin:34px auto 112px;overflow:hidden;background:var(--paper);border:var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--ink);text-align:center;transform:rotate(-1.5deg);transform-origin:50% 0;animation:nametag-swing 1.1s ease-out}
.nametag::before{content:"";position:absolute;top:8px;left:12px;width:12px;height:12px;border:3px solid var(--ink);border-radius:50%;background:var(--sun)}
.nametag__label{display:block;padding:3px 18px 4px 36px;background:var(--pink);border-bottom:var(--line);font-size:.9rem;line-height:1.5;letter-spacing:.3em}
.nametag__name{display:block;padding:10px 24px 14px;font:400 1.7rem/1.35 var(--disp);overflow-wrap:anywhere}
@keyframes nametag-swing{0%{transform:rotate(-10deg)}35%{transform:rotate(4deg)}65%{transform:rotate(-3deg)}100%{transform:rotate(-1.5deg)}}

/* ---- 名乗り（正体）パネル ---- */
.nm{background:var(--sky);border:var(--line);border-radius:30px 30px 30px 8px;padding:18px;box-shadow:5px 5px 0 var(--ink)}
.nm.weak{background:#dcd9ea;border-style:dashed}
#meCard .nm:not(.weak){background:var(--lime)}
#oppCard .nm:not(.weak){background:var(--pink)}
.nm h3{margin:0 0 8px;font:400 1.95rem/1.35 var(--disp);overflow-wrap:anywhere}
.nm p{margin:0 0 12px;font-size:1.3rem;line-height:1.75}
.nm .note,.nm .meta{color:var(--mute);font-size:.95rem}
.nm .meta{margin:10px 0 0}
.params{display:grid;grid-template-columns:auto 1fr;gap:3px 16px;margin:0;font-size:1.15rem}
.params dt{color:var(--mute)}
.params dd{margin:0;text-align:right}

/* ---- バトル ---- */
.roomid{margin:0 0 6px;text-align:center;font-size:1rem;color:var(--mute)}
.roomid b{color:var(--ink);letter-spacing:.2em}
.bars{display:flex;justify-content:space-between;gap:8px;font-size:1.1rem}
.bars div:last-child{text-align:right}
.st{letter-spacing:.12em;font-size:1.5rem;color:var(--pink)}
.st i{font-style:normal;display:inline-block}
.st i.off{color:#fff}
.st i.new{animation:starpop .8s .3s backwards}
.theme{background:var(--sky);border:var(--line);padding:14px 18px;text-align:center;font:400 clamp(1.9rem,8.5vw,3rem)/1.35 var(--disp);transform:rotate(-1deg);margin:14px auto 26px;max-width:760px;animation:don .8s backwards;border-radius:8px 24px 8px 24px;box-shadow:5px 5px 0 var(--ink)}
.shout{font:400 clamp(2.6rem,11vw,3.8rem)/1.2 var(--disp);margin:10px 0 4px}
.code{font:400 2.8rem var(--disp);letter-spacing:.2em;margin:8px 0}
.arena{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start;margin-top:8px}
#meCard{animation:slideL .65s var(--boing) backwards}
#oppCard{animation:slideR .65s var(--boing) backwards}
.chatwrap{display:flex;flex-direction:column;gap:10px}
.log{height:min(64vh,560px);overflow-x:hidden;overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column;gap:10px;padding:12px;background:rgba(255,255,255,.4);border:var(--line);border-radius:20px}
.log::-webkit-scrollbar{display:none}
.log>:first-child{margin-top:auto}
.msg{max-width:88%;padding:8px 14px;border:var(--line);border-radius:20px;font-size:1.25rem;line-height:1.65;overflow-wrap:anywhere}
.msg small{display:block;font-size:.8rem;color:var(--mute);line-height:1.4}
.msg.me{transform-origin:left bottom;align-self:flex-start;background:var(--lime);border-bottom-left-radius:4px}
.msg.opp{transform-origin:right bottom;align-self:flex-end;background:var(--pink);border-bottom-right-radius:4px}
.msg.n{align-self:center;background:var(--sky);border-style:dashed;font-size:1.1rem;text-align:center}
.ctl{display:flex;flex-direction:column;align-items:center;gap:12px}
.verdict{white-space:pre-line;font:400 1.9rem/1.4 var(--disp);text-align:center;padding:14px;border:var(--line);background:var(--lime);margin:16px 0;border-radius:24px;animation:slam .7s backwards;box-shadow:5px 5px 0 var(--ink)}
.verdict.lose{background:var(--pink)}
.ctl .verdict{width:100%;margin:0}

/* ---- 結果・図鑑 ---- */
.grid{display:grid;gap:20px;margin-top:16px}
.hist{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}
.hist li{text-align:center;background:var(--sky);border:var(--line);border-radius:16px;padding:8px 16px;line-height:1.5;box-shadow:3px 3px 0 var(--ink)}
.hist li:nth-child(even){background:var(--lime)}
.hist small{display:block;color:var(--mute);font-size:.9rem}
.hist .w,.hist .l{border:2px solid var(--ink);border-radius:999px;padding:0 10px}
.hist .w,.hist .l{display:block;width:fit-content;margin-left:auto}
.hist .w{background:var(--pink)}
.hist .l{background:#dcd9ea}

/* ---- 名乗りの絵文字（カード・VS・図鑑で共通）---- */
.emo{margin-left:.25em;font-size:.9em;-webkit-text-stroke:0}
.vsn .emo{display:block;margin:2px 0 0;font-size:.75em;line-height:1.2}

/* ---- 図鑑の一覧（1行ずつ。押すと詳細ウインドウ）----
   .clist>li>.crow = 1行。中身 = __name（名前＋絵文字）/ __theme（お題）/ __res（勝敗）/ __opp（相手の名乗り）
   1ページの件数は JS の COLL_PER_PAGE。詳細ウインドウは dialog.cmodal */
.clist{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.clist>li{animation:histL .5s cubic-bezier(.16,1,.3,1) backwards;animation-delay:min(calc(var(--i,0)*.05s),.5s)}
.clist.still>li{animation:none}
.crow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.5fr) auto minmax(0,1.1fr);grid-template-areas:"name theme res opp";align-items:center;gap:6px 14px;width:100%;padding:8px 18px;border-radius:16px;text-align:left;font-size:1rem;line-height:1.4;box-shadow:3px 3px 0 var(--ink)}
.clist>li:nth-child(even) .crow{background:var(--lime)}
.crow__name{grid-area:name;font-weight:700;overflow-wrap:anywhere}
.crow__theme{grid-area:theme;overflow-wrap:anywhere}
.crow__res{grid-area:res;justify-self:start;border:2px solid var(--ink);border-radius:999px;padding:0 10px;background:var(--pink);white-space:nowrap}
.crow__res.l{background:#dcd9ea}
.crow__opp{grid-area:opp;overflow-wrap:anywhere}
.crow__opp::before{content:"vs ";color:var(--mute)}
.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:16px 0}
.pager span{min-width:6em;text-align:center}
.cmodal{width:min(560px,calc(100vw - 28px));max-height:calc(100dvh - 24px);padding:10px 10px 16px;border:none;background:none;color:var(--ink);overflow-y:auto}
.cmodal::backdrop{background:rgba(40,38,56,.55)}
.cmodal[open]{animation:pop .4s var(--boing)}
@media(max-width:600px){
  .crow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"name res" "theme theme" "opp opp"}
}

/* ---- 演出：画面揺れ・紙吹雪・帯・リーチの縁取り ----
   画面揺れ = main.shake（小）/ main.shake-big（大）。強さは --sh
   リーチ中は html[data-reach] が付き、縁が BGM のビートに合わせて赤く光る。BGMを速める・ビートを強める量は JS の REACH_RATE / REACH_BEAT */
@keyframes shake{0%,100%{transform:none}15%{transform:translate(calc(var(--sh)*-1),calc(var(--sh)*.4))}30%{transform:translate(var(--sh),calc(var(--sh)*-.5))}45%{transform:translate(calc(var(--sh)*-.8),calc(var(--sh)*.5))}60%{transform:translate(calc(var(--sh)*.7),calc(var(--sh)*-.3))}75%{transform:translate(calc(var(--sh)*-.4),0)}}
main.shake{--sh:5px;animation:shake .4s}
main.shake-big{--sh:12px;animation:shake .75s}
@keyframes bannerIn{0%{transform:scale(.2) rotate(-8deg);opacity:0}18%{transform:scale(1.2) rotate(-3deg);opacity:1}30%{transform:scale(1) rotate(-3deg)}80%{transform:scale(1) rotate(-3deg);opacity:1}100%{transform:scale(1.1) rotate(-3deg);opacity:0}}
#banner{position:fixed;left:0;right:0;top:32%;z-index:25;text-align:center;pointer-events:none;color:#fff;font:400 clamp(2.6rem,12vw,6.5rem)/1.1 var(--disp);-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill;filter:drop-shadow(5px 5px 0 var(--pink));animation:bannerIn 1.5s both}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
#reachGlow{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;box-shadow:inset 0 0 70px 10px rgba(255,60,120,.5);transition:opacity .08s}
html[data-reach] #reachGlow{opacity:calc(.3 + var(--beat,0)*.7)}

/* ---- アニメーション（手で調整しやすいようにまとめた） ----
   バトルログ   : .msg.me=msgL（左から）/ .msg.opp=msgR（右から）/ .msg.n=msgFade（ナレーション）
   結果の上の文 : #stage>.verdict = don（バトルテーマ .theme と同じ）
   戦歴         : .hist li = histL（奇数）/ histR（偶数）。開始 .7s、1つごとの間隔 .3s
   図鑑         : .grid>.nm = collpop（1枚ずつ。回転の向きは --rot、遅れは --i×.08s で最大1.2s） */
@keyframes msgL{from{transform:translateX(-110%);opacity:0}to{transform:none;opacity:1}}
@keyframes msgR{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}
@keyframes msgFade{from{opacity:0;transform:translateY(8px) scale(.96);filter:blur(3px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes histL{from{transform:translateX(-120%);opacity:0}to{transform:none;opacity:1}}
@keyframes histR{from{transform:translateX(120%);opacity:0}to{transform:none;opacity:1}}
@keyframes collpop{0%{transform:scale(.2) rotate(var(--rot,-12deg));opacity:0}60%{transform:scale(1.1) rotate(calc(var(--rot,-12deg)*-.25));opacity:1}80%{transform:scale(.97) rotate(0deg)}100%{transform:none;opacity:1}}
.msg.me{animation:msgL .55s cubic-bezier(.16,1,.3,1) backwards}
.msg.opp{animation:msgR .55s cubic-bezier(.16,1,.3,1) backwards}
.msg.n{animation:msgFade .9s ease-out backwards}
#stage>.verdict{animation:don .8s backwards;transform:rotate(-1deg)}
#stage>.hist{animation:none}
.hist li{animation:histL .6s cubic-bezier(.16,1,.3,1) backwards;animation-delay:calc(.7s + var(--i,0)*.3s)}
.hist li:nth-child(even){animation-name:histR}
.hist~.row{animation-delay:calc(.7s + var(--n,5)*.3s)}
#coll>.grid{animation:none}
.grid>.nm{animation:collpop .6s var(--boing) backwards;animation-delay:min(calc(var(--i,0)*.08s),1.2s)}
.grid>.nm:nth-child(even){--rot:12deg}
.grid.still>.nm{animation:none}

/* ---- 睨み合い（VS）：名乗りが出そろってから、バトルが始まるまで ----
   .vs の中身 = .vsn.me（自分の名乗り）/ .vsx（VS）/ .vsn.opp（相手の名乗り）
   読んでいる側は .on、もう片方は .dim になる。待ち時間の調整は JS の READ_BASE / READ_PER_CHAR */
@keyframes glareL{0%,100%{transform:translateX(0) rotate(-1.5deg)}50%{transform:translateX(12px) rotate(1deg)}}
@keyframes glareR{0%,100%{transform:translateX(0) rotate(1.5deg)}50%{transform:translateX(-12px) rotate(-1deg)}}
.vs{height:min(64vh,560px);display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:6px;padding:12px}
.vsn{padding:12px 16px;border:var(--line);border-radius:24px;text-align:center;font:400 clamp(1.7rem,4.6vw,2.7rem)/1.3 var(--disp);overflow-wrap:anywhere;box-shadow:5px 5px 0 var(--ink);transition:opacity .35s}
.vsn.me{background:var(--lime);margin-right:12%;animation:slideL .65s var(--boing) backwards,glareL 1.7s ease-in-out .9s infinite}
.vsn.opp{background:var(--pink);margin-left:12%;animation:slideR .65s var(--boing) .15s backwards,glareR 1.7s ease-in-out 1.05s infinite}
.vsx{align-self:center;color:#fff;font:400 clamp(3.4rem,11vw,5.6rem)/1 var(--disp);-webkit-text-stroke:.14em var(--ink);paint-order:stroke fill;filter:drop-shadow(4px 4px 0 var(--pink));animation:don .8s .4s backwards}
.vsn.dim{opacity:.4}
.nm{transition:transform .35s var(--boing),opacity .35s,box-shadow .35s}
.arena .nm.focus{transform:scale(1.05);box-shadow:8px 8px 0 var(--ink)}
.arena .nm.dim{opacity:.55;transform:scale(.97)}
@media(max-width:900px){.arena{grid-template-columns:1fr 1fr}.chatwrap{grid-column:1/-1;order:3}}
/* ---- 左下の音量ドック：読み上げ・BGMのアイコンを縦に並べる ----
   .vrow がカプセル。ふだんは丸いアイコンだけ（44px）。マウスを乗せると右へ伸びて、中からスライダーが出てくる。離すと逆に縮む
   伸びる幅は .vrow:hover の width（アイコン38px＋.vslの幅＋枠6px）、開く速さは transition、閉じる動きは .vrow 本体の transition */
#vdock{position:fixed;left:10px;bottom:10px;z-index:20;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.vrow{display:flex;align-items:center;width:44px;height:44px;overflow:hidden;background:var(--paper);border:var(--line);border-radius:999px;box-shadow:3px 3px 0 var(--ink);transition:width .3s cubic-bezier(.6,-.28,.735,.045),background .2s}
.vrow:hover,.vrow:has(:focus-visible){width:210px;transition:width .5s var(--boing),background .2s}
#speakRow.on{background:var(--lime)}
#bgmRow.zero{background:var(--pink)}
.vbtn{flex:none;width:38px;height:38px;min-height:0;padding:0;display:grid;place-items:center;font-size:1.3rem;line-height:1;border:0;border-radius:50%;background:none;box-shadow:none}
.vbtn:hover{transform:scale(1.15);box-shadow:none}
.vbtn:active{transform:scale(.9);box-shadow:none}
.vbtn:focus-visible{outline-offset:-4px}
.vsl{flex:none;width:166px;padding-right:16px;opacity:0;transform:translateX(-14px) scale(.9);transform-origin:left center;transition:opacity .15s,transform .2s}
.vrow:hover .vsl,.vrow:has(:focus-visible) .vsl{opacity:1;transform:none;transition:opacity .25s .12s,transform .5s .1s var(--boing)}
.vsl input{display:block;width:100%;margin:0}
input[type=checkbox]{width:26px;height:26px;padding:0;margin:0;flex:none;accent-color:var(--pink)}
.trk{display:flex;align-items:center;gap:10px;margin:8px 0;padding:6px 8px 6px 14px;font-size:1.1rem;background:rgba(255,255,255,.7);border-radius:14px}
.trkl{display:flex;align-items:center;gap:10px;flex:1;min-width:0;margin:0;cursor:pointer;overflow-wrap:anywhere}
.trk button{flex:none}

/* ---- BGMの音に合わせて動く要素 ----
   JS が BGM の音を解析して --beat（0〜1）を毎フレーム更新する。無音・音量0・読み込み前は 0。
   背景の図形は 5個に1個だけ反応し、種類 .g=その場で拡大 / .s=その場で縮小 / .l=左へ流れる / .r=右へ流れる（JSが振り分け）。--k は個体ごとの強さ
   ・拡大/縮小は <svg> に掛ける（外側の .sh に掛けると、上へ昇る動き（translateY）まで拡大率に引きずられて、動きながら拡大して見える）
   ・左右は戻らない：JS が音の大きさを足し込んで --dx（px）を増やし続ける。図形が下から昇り直すたびに 0 へ戻す
   ロゴは5文字それぞれ別の --lb（時間差＋強さの段階はJSの LOGO_LAG / LOGO_MUL）
   他の要素を動かすときは「scale:calc(1 + var(--beat,0)*倍率)」を足すだけ（transform のアニメとは干渉しない） */
#bg .sh.g svg{scale:calc(1 + var(--beat,0)*.6*var(--k,1))}
#bg .sh.s svg{scale:calc(1 - var(--beat,0)*.42*var(--k,1))}
#bg .sh.l,#bg .sh.r{translate:calc(var(--dx,0)*1px) 0}
.logo span{scale:calc(1 + var(--lb,0)*.1);translate:0 calc(var(--lb,0)*-6px)}
.theme{scale:calc(1 + var(--beat,0)*.03)}

  const KINDS=['g','s','l','r'].sort(()=>Math.random()-.5);let ki=0; // 種類の割り当て順は毎回ランダム（スマホは図形が少ないので、4種のうち3種になる）

    const d=document.createElement('div');
    d.className='sh';
    d.style.cssText=`left:${r(-2,98).toFixed(1)}%;width:${size.toFixed(0)}px;height:${size.toFixed(0)}px;animation-duration:${rise.toFixed(1)}s;animation-delay:-${(Math.random()*rise).toFixed(1)}s`;
    if(i%5===0){const kd=KINDS[ki++%4],k=+r(.8,1.3).toFixed(2);d.classList.add(kd);d.style.setProperty('--k',k);if(kd==='l'||kd==='r')bgDrift.push({el:d,dir:kd==='l'?-1:1,k,x:0})} // 5個に1個だけBGMに反応（拡大・縮小・左・右を順に割り当て）
    const color=COLORS[Math.floor(Math.random()*COLORS.length)];
    d.innerHTML=`<svg viewBox="0 0 100 100" style="animation-duration:${spin.toFixed(1)}s;animation-direction:${Math.random()<.5?'normal':'reverse'}">${SHAPES[i%SHAPES.length](color)}</svg>`;
    bg.append(d);
  }
  // 図形が下から昇り直したら、横のずれも元に戻す（昇り直しのアニメ名は rise。回転の spin は無視）
  bg.addEventListener('animationiteration',e=>{
    if(e.animationName!=='rise')return;
    const o=bgDrift.find(x=>x.el===e.target);
    if(o){o.x=0;o.el.style.setProperty('--dx',0)}
  });
})();

/* ================= サウンド =================
   BGM・SE・音量調整・BGMの音の解析は、すべて Web Audio を通す。
   BGM : <audio> → (解析用の分岐) / bgmGain → 出力     SE : デコード済みバッファ → グループ音量 → seGain → 出力
   Web Audio が使えない端末では、BGM は従来どおり audio.volume で鳴らし、SE と音の解析だけが無効になる */
const touch=matchMedia('(hover:none) and (pointer:coarse)').matches;
const VOL_DEF=15; // 音量の初期値（左下のスライダー1本で、BGMとSEの両方を調整する）
const SE_CURVE=.27; // SEの音量 = 音量(0〜1) の SE_CURVE 乗。小さいほど、小音量のときSEがBGMより大きく聞こえる（初期音量でほぼ従来のバランス）
const clamp01=v=>Math.min(1,Math.max(0,v));
let volPct=LS.get('vol',VOL_DEF); // BGM音量（0〜100）。左下の音量ボタンと設定画面のスライダーで共通
let bgmMuted=!!LS.get('bgmMuted',false); // アイコンのクリックによるミュート（音量の値は残す）
const vol=()=>bgmMuted?0:clamp01(volPct/100);
let ac=null,bgmGain=null,seGain=null,analyser=null,graphOk=false,acTried=false;
let bgmOn=false,duck=1; // duck: 読み上げ中はBGMを小さくする倍率

/* ---- BGM（チェックした曲をシャッフルしてループ。最初のクリックで開始） ----
   曲を足すときは public/bgm/ にmp3を置いて、下の一覧に1行足す（id=ファイル名の .mp3 を除いた部分、title=表示名）。
   <audio> は1つを使い回し、曲が変わるたびに src を差し替える（スマホでも安定するため） */
const BGM_LIST=[
  {id:'track1',title:'ABCで始めよう'},
  {id:'track2',title:'Boss Picnic'},
  {id:'track3',title:'Button Joyride'},
  {id:'track4',title:'High Score Sunshine'},
  {id:'track5',title:'Raid Crash!'},
  {id:'track6',title:'ナノリアイ・パレード'},
  {id:'track7',title:'ナノリアイなの!?'},
  {id:'track8',title:'笑って弾けて'}
];
const bgmA=new Audio();bgmA.preload='auto';
const bgmOff=()=>LS.get('bgmOff',[]); // チェックを外した曲のid（初期は空＝すべて選択）
let bgmCur=null,bgmQ=[]; // 再生中の曲 / これから流す順番（シャッフル済み）
let bgmPrev=null,bgmSnapV=null; // 試聴中の曲 / 試聴を始める前のBGMの状態
function bgmPick(){
  const off=bgmOff(),sel=BGM_LIST.filter(t=>!off.includes(t.id));
  if(!sel.length)return null;
  bgmQ=bgmQ.filter(t=>sel.includes(t));
  if(!bgmQ.length){ // 全曲を1周したら、新しくシャッフルし直す
    bgmQ=sel.slice();
    for(let i=bgmQ.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bgmQ[i],bgmQ[j]]=[bgmQ[j],bgmQ[i]]}
    if(bgmQ.length>1&&bgmQ[0]===bgmCur)bgmQ.push(bgmQ.shift()); // 周の変わり目で同じ曲が続かないように
  }
  return bgmQ.shift();
}
function bgmNext(){
  const t=bgmPick();
  if(!t){bgmA.pause();bgmCur=null;return} // 1曲も選んでいなければ無音
  bgmCur=t;bgmA.src=`/bgm/${t.id}.mp3`;
  bgmA.play().catch(e=>{if(e&&e.name==='NotAllowedError')bgmOn=false}); // 自動再生が止められたときだけ、次の操作でやり直す
}
bgmA.onended=()=>bgmPrev?previewStop():bgmNext(); // 試聴が最後まで流れたときは、BGMに戻る
function bgmSelChanged(){ // 設定画面でチェックを変えたとき
  const off=bgmOff();
  bgmQ=bgmQ.filter(t=>!off.includes(t.id));
  if(bgmPrev)return; // 試聴中は、終わってから反映される
  if(bgmOn&&(!bgmCur||off.includes(bgmCur.id)))bgmNext(); // 流れている曲が外れた／無音だったときは次の曲へ
}
// いまの再生位置を覚える／覚えた状態から再開する（試聴の前後、アプリが裏に回る前後で使う）
const bgmSnap=()=>({t:bgmCur,pos:bgmA.currentTime,on:bgmOn&&!!bgmCur&&!bgmA.paused});
function bgmResume(sn){
  if(!bgmOn){bgmA.pause();return}
  if(sn&&sn.on&&sn.t&&!bgmOff().includes(sn.t.id)){ // 同じ曲を、止めた位置から続ける
    bgmCur=sn.t;bgmA.src=`/bgm/${sn.t.id}.mp3`;
    bgmA.addEventListener('loadedmetadata',()=>{try{bgmA.currentTime=sn.pos}catch{}},{once:true});
    bgmA.play().catch(e=>{if(e&&e.name==='NotAllowedError')bgmOn=false});
  }else bgmNext(); // その曲が外されていた・元々鳴っていなかったときは、通常どおり次の曲へ
}
/* 試聴：設定画面の ▶ で、その曲を流す（BGMは止まり、試聴が終わる／止めたら元のBGMに戻る） */
function previewStart(t){
  if(!bgmPrev)bgmSnapV=bgmSnap(); // 試聴から試聴へ切り替えても、最初の状態へ戻れる
  bgmPrev=t;bgmA.src=`/bgm/${t.id}.mp3`;
  bgmA.play().catch(e=>{if(e&&e.name==='NotAllowedError')previewStop()});
  updatePreviewUI();
}
function previewStop(){
  if(!bgmPrev)return;
  const sn=bgmSnapV;bgmPrev=null;bgmSnapV=null;
  updatePreviewUI();bgmResume(sn);
}
/* スマホ（タッチ端末）で他のアプリへ移る・画面を消すときは、BGMを止めて <audio> も空にする。
   <audio> が曲を持ったままだと、iOS のコントロールセンターやロック画面に「再生中」の操作パネルが残り続けるため。戻ってきたら続きから再開。
   PC のタブ切り替えでは止めない（止めたいときは true にする） */
const BGM_STOP_IN_BACKGROUND=touch;
let bgSnap=null;
document.addEventListener('visibilitychange',()=>{
  if(!BGM_STOP_IN_BACKGROUND)return;
  if(document.hidden){
    if(bgSnap)return;
    bgSnap=bgmPrev?bgmSnapV:bgmSnap(); // 試聴中なら、試聴前の状態へ戻す前提で保存
    bgmPrev=null;bgmSnapV=null;updatePreviewUI();
    bgmA.pause();bgmA.removeAttribute('src');bgmA.load();
    try{if('mediaSession' in navigator){navigator.mediaSession.playbackState='none';navigator.mediaSession.metadata=null}}catch{}
  }else if(bgSnap){
    const sn=bgSnap;bgSnap=null;
    if(ac&&ac.state!=='running')ac.resume().catch(()=>{});
    bgmResume(sn);
  }
});
function bgmVol(){
  const v=clamp01(vol()*duck);
  if(graphOk)bgmGain.gain.setTargetAtTime(v,ac.currentTime,.05);
  else bgmA.volume=v;
  seVolApply(); // SEも同じ音量スライダー・ミュートに連動
}
// 最初の操作の中で AudioContext を作り、BGMの <audio> をつなぐ（失敗したら従来方式のまま）
function audioInit(){
  if(acTried)return;acTried=true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    ac=new AC();
    bgmGain=ac.createGain();seGain=ac.createGain();
    analyser=ac.createAnalyser();analyser.fftSize=1024;analyser.smoothingTimeConstant=.6;
    const sink=ac.createGain();sink.gain.value=0; // 解析の分岐は音を出さない（確実に動かすため無音で出力につなぐ）
    analyser.connect(sink);sink.connect(ac.destination);
    bgmGain.connect(ac.destination);seGain.connect(ac.destination);
    const src=ac.createMediaElementSource(bgmA);src.connect(analyser);src.connect(bgmGain);bgmA.volume=1; // 音量は bgmGain 側で行う
    fftBuf=new Uint8Array(analyser.frequencyBinCount);
    beatBins=Math.max(2,Math.ceil(BEAT_HZ/(ac.sampleRate/analyser.fftSize)));
    graphOk=true;
    seVolApply();seDecode();
  }catch(err){graphOk=false;console.warn('Web Audio を使えません',err)}
}
function audioUnlock(){
  audioInit();
  if(ac&&ac.state!=='running')ac.resume().catch(()=>{}); // スマホは操作のたびに、鳴る状態へ戻す
}
function bgmStart(){audioUnlock();if(bgmOn)return;bgmOn=true;bgmVol();bgmNext()}
['pointerdown','pointerup','touchend','click','keydown'].forEach(e=>addEventListener(e,bgmStart));
bgmVol();

/* ---- 音量（BGMとSE共通。左下のドック）：アイコンを押すとミュートON/OFF、スライダーで音量。ミュート中や音量0はミュートの絵 ---- */
function volUI(){
  const z=bgmMuted||volPct===0,e=bgmMuted?0:volPct;
  const b=$('#volBtn');
  b.textContent=z?'🔇':'🔊';b.setAttribute('aria-pressed',z);b.setAttribute('aria-label',z?'BGM：ミュート中（押すと解除）':'BGM：オン（押すとミュート）');
  $('#bgmRow').classList.toggle('zero',z);
  $('#vquick').value=e;
}
function setVol(v){
  volPct=v;LS.set('vol',v);
  if(v>0&&bgmMuted){bgmMuted=false;LS.set('bgmMuted',false)} // スライダーを動かしたらミュート解除
  volUI();bgmVol();
}
function toggleBgmMute(){
  if(bgmMuted||volPct===0){bgmMuted=false;if(volPct===0){volPct=VOL_DEF;LS.set('vol',volPct)}} // 解除（音量0だったときは初期音量へ）
  else bgmMuted=true;
  LS.set('bgmMuted',bgmMuted);volUI();bgmVol();
}
$('#vquick').oninput=e=>setVol(+e.target.value);
$('#volBtn').onclick=toggleBgmMute;
volUI();

/* ---- 設定画面のBGM一覧（チェックした曲だけが流れる。0曲でも可） ---- */
const prevBtns={};
function updatePreviewUI(){
  BGM_LIST.forEach(t=>{
    const b=prevBtns[t.id];if(!b)return;
    const on=!!bgmPrev&&bgmPrev.id===t.id;
    b.textContent=on?'■ 停止':'▶ 試聴';b.setAttribute('aria-pressed',on);b.classList.toggle('pri',on);b.classList.toggle('ghost',!on);
  });
}
function drawTracks(){
  const off=bgmOff();
  $('#trkList').replaceChildren(...BGM_LIST.map(t=>{
    const b=el('button',{class:'ghost sm',type:'button','aria-label':`${t.title}を試聴`,onclick:()=>bgmPrev&&bgmPrev.id===t.id?previewStop():previewStart(t)},'▶ 試聴');
    prevBtns[t.id]=b;
    return el('div',{class:'trk'},
      el('label',{class:'trkl'},el('input',{type:'checkbox',checked:!off.includes(t.id),onchange:e=>{
        const o=bgmOff().filter(x=>x!==t.id);if(!e.target.checked)o.push(t.id);
        LS.set('bgmOff',o);bgmSelChanged();
      }}),t.title),b);
  }));
  updatePreviewUI();
}
const setAllTracks=on=>{LS.set('bgmOff',on?[]:BGM_LIST.map(t=>t.id));drawTracks();bgmSelChanged()};
$('#trkAll').onclick=()=>setAllTracks(true);
$('#trkNone').onclick=()=>setAllTracks(false);
drawTracks();

/* ---- SE（効果音）----
   public/se/ に置いたWAVを、鳴らす場面ごとのグループに分ける。複数あるグループは毎回ランダム（直前と同じ音は避ける）
   SE_GAIN: グループごとの基本音量 / SE_ADJ: 録音レベルの差を直す個別の補正（1が補正なし） */
const SE_FILES={
  hover:['bubblehover1','bubblehover2','bubblehover3','bubblehover4'],
  click:['bubblepop1','bubblepop2','bubblepop3','click1'],
  round:['drum1','drum2','drum3','drum4'],
  lose:['lose1','lose2'],
  win:['win1','win2'],
  slide:['slide1','slide2','woosh1','woosh2','woosh3','woosh4','woosh5']
};
const SE_GAIN={hover:.45,click:.7,round:1,lose:.8,win:1,slide:.9};
const SE_ADJ={woosh5:2.5,drum2:1.25,win2:1.6};
const seRaw={},seBuf={},seLast={};
const seNames=Object.values(SE_FILES).flat();
// 読み込みはページが落ち着いてから（BGMやフォントの邪魔をしない）。取得だけ先にして、デコードは AudioContext ができてから
addEventListener('load',()=>setTimeout(()=>{
  seNames.forEach(n=>{seRaw[n]=fetch(`/se/${n}.wav`).then(r=>r.ok?r.arrayBuffer():null).catch(()=>null)});
  seDecode();
},600));
function seDecode(){
  if(!ac)return;
  seNames.forEach(n=>{
    if(!seRaw[n]||seBuf[n])return;
    seRaw[n].then(b=>b&&new Promise((ok,ng)=>ac.decodeAudioData(b.slice(0),ok,ng))).then(buf=>{if(buf)seBuf[n]=buf}).catch(()=>{});
  });
}
function seVolApply(){if(graphOk)seGain.gain.value=clamp01(Math.pow(vol(),SE_CURVE))}
function playSE(g){
  if(!graphOk||ac.state!=='running')return;
  const ready=SE_FILES[g].filter(n=>seBuf[n]);
  if(!ready.length)return;
  let n=rpick(ready);
  if(ready.length>1&&n===seLast[g])n=rpick(ready.filter(x=>x!==n)); // 同じ音が続かないように
  seLast[g]=n;
  const s=ac.createBufferSource(),gn=ac.createGain();
  s.buffer=seBuf[n];gn.gain.value=(SE_GAIN[g]??1)*(SE_ADJ[n]??1);
  s.connect(gn);gn.connect(seGain);
  s.onended=()=>{s.disconnect();gn.disconnect()};
  s.start();
}
// ボタン：クリック音はどのボタンでも鳴る（押した瞬間に disabled になるボタンもあるため、先に動く capture で拾う）
addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&!b.disabled)playSE('click')},true);
// ボタン：ホバー音はマウスのときだけ（スマホにホバーはない）。連続で鳴りすぎないよう間隔をあける
let lastHover=0;
addEventListener('pointerover',e=>{
  if(e.pointerType!=='mouse')return;
  const b=e.target.closest&&e.target.closest('button');
  if(!b||b.disabled||b.contains(e.relatedTarget))return;
  const t=performance.now();if(t-lastHover<80)return;lastHover=t;
  playSE('hover');
});

/* ---- BGMの音に合わせて動かす ----
   BGM（音量スライダー・読み上げ中の音量下げより手前）を解析して、0〜1 の --beat を毎フレーム更新する。
   「低音の大きさ」と「直近の平均より急に大きくなった分（ビート）」を混ぜ、曲ごとの音量差は自動で吸収する。
   動きの調整: DRIFT_SPEED=左右へ流れる速さ / BEAT_HZ=見る音の高さの上限 / BEAT_SENS=反応の強さ / BEAT_MIX=ビート成分の割合
              BEAT_RISE=立ち上がり（大きいほど素早い）/ BEAT_FALL=余韻（1に近いほどゆっくり戻る）
   ロゴ: 5文字は LOGO_LAG（ミリ秒の遅れ）だけ遅れて、LOGO_MUL の強さで動く（左から右へ波が伝わり、だんだん強くなる） */
const BEAT_HZ=300,BEAT_SENS=1.5,BEAT_MIX=.5,BEAT_RISE=.3,BEAT_FALL=.94;
const REACH_RATE=1.08,REACH_BEAT=1.4; // リーチ中：BGMの速さの倍率 / ビート反応の強さの倍率
let reachTxt=''; // リーチ中の帯の文言。空ならリーチではない
const DRIFT_SPEED=35,DRIFT_GATE=.20; // 左右へ流れる図形：音が大きいほど速く（最大 px/秒）。GATE 以下の小さな音では流れない
const LOGO_LAG=[0,70,140,210,280],LOGO_MUL=[1.2,1.3,1.5,1.6,1.75];
let fftBuf=null,beatBins=2,beatV=0,beatAvg=0,beatPeak=.1,beatT=0,beatSet=0;
const beatH=[],logoEls=[...document.querySelectorAll('.logo span')],logoSet=logoEls.map(()=>0);
function beatTick(t){
  requestAnimationFrame(beatTick);
  const dt=Math.min(.1,(t-beatT)/1000)||.016;beatT=t;
  let x=0;
  if(graphOk&&bgmOn&&(bgmCur||bgmPrev)&&vol()>0&&ac.state==='running'){
    analyser.getByteFrequencyData(fftBuf);
    let s=0;for(let i=0;i<beatBins;i++)s+=fftBuf[i];
    const lv=s/beatBins/255;
    beatAvg+=(lv-beatAvg)*Math.min(1,dt*2.5); // 約0.4秒でならした「いつもの大きさ」
    beatPeak=Math.max(beatPeak*Math.pow(.998,dt*60),lv,.05); // 最近の最大値（ゆっくり下がる）
    const level=lv/beatPeak;
    const hit=Math.max(0,lv-beatAvg)/Math.max(.04,beatPeak-beatAvg);
    x=clamp01((level*(1-BEAT_MIX)*.6+hit*BEAT_MIX)*BEAT_SENS*(reachTxt?REACH_BEAT:1));
  }
  if(x>beatV)beatV+=(x-beatV)*(1-Math.pow(1-BEAT_RISE,dt*60)); // 立ち上がりも少しなめらかに
  else beatV*=Math.pow(BEAT_FALL,dt*60);                      // 下がりはゆっくり
  // 左右へ流れる図形：音の大きさ分だけ一方向に進み続け、戻らない
  const drive=Math.max(0,beatV-DRIFT_GATE);
  if(drive>0)for(const o of bgDrift){o.x+=o.dir*drive*DRIFT_SPEED*o.k*dt;o.el.style.setProperty('--dx',o.x.toFixed(1))}
  const v=beatV<.01?0:beatV;
  if(v!==beatSet&&(v===0||Math.abs(v-beatSet)>.004)){beatSet=v;document.documentElement.style.setProperty('--beat',v.toFixed(3))}
  // ロゴ：過去の値を文字ごとに違う遅れで読み出す（ホーム画面を見ているときだけ）
  beatH.push([t,beatV]);while(beatH.length>2&&t-beatH[0][0]>700)beatH.shift();
  if(!$('#home').hidden)logoEls.forEach((e,j)=>{
    const T=t-LOGO_LAG[j];let b=0;
    for(let i=beatH.length-1;i>=0;i--)if(beatH[i][0]<=T){b=beatH[i][1];break}
    const w=b<.01?0:+(b*LOGO_MUL[j]).toFixed(3);
    if(w!==logoSet[j]){logoSet[j]=w;e.style.setProperty('--lb',w)}
  });
}
requestAnimationFrame(beatTick);

// 名乗りの読み上げ（ブラウザ内蔵の音声合成。声は端末まかせ。設定は保存）
const SPEAK_RATE_PC=2,SPEAK_RATE_TOUCH=1.4; // 読み上げ速度（1が標準）。スマホは速く聞こえるため別設定
const SPEAK_VOL_DEF=100; // 読み上げ音量の初期値（0〜100）
const speakRate=()=>touch?SPEAK_RATE_TOUCH:SPEAK_RATE_PC;
const NAME_LIMITS=[10,6,3]; // 名乗りの文字数の上限（★0個・1個・2個のとき）。全部10にすれば無効
const nameLimit=n=>NAME_LIMITS[Math.min(n,NAME_LIMITS.length-1)];
let speakOn=!!LS.get('speak',true),speakVol=LS.get('speakVol',SPEAK_VOL_DEF),speechFails=0,unlocked=false; // speakOn=アイコンのオンオフ / speakVol=スライダーの値
const canSpeak='speechSynthesis' in window;
// スマホは「タップの中で一度しゃべらせる」まで音声が出ないことがあるため、最初のタップで無音の発話をして解錠する
function unlockSpeech(){if(unlocked||!canSpeak)return;unlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch{}}
['pointerup','touchend','click','keydown'].forEach(e=>addEventListener(e,unlockSpeech,{passive:true}));
function applySpeak(){
  const b=$('#speak'),on=speakOn&&speakVol>0;
  b.textContent=on?'🗣️':'🤐';b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',on?'名乗りの読み上げ：オン（押すとオフ）':'名乗りの読み上げ：オフ（押すとオン）');
  $('#speakRow').classList.toggle('on',on);
  $('#speakVol').value=on?speakVol:0;
}
$('#speak').onclick=()=>{
  if(!speakOn||speakVol===0){speakOn=true;if(speakVol===0){speakVol=SPEAK_VOL_DEF;LS.set('speakVol',speakVol)}} // オンに戻す（音量0だったときは初期音量へ）
  else speakOn=false;
  LS.set('speak',speakOn);applySpeak();

  if(!speakOn){try{speechSynthesis.cancel()}catch{}return}

/* ---- 演出：リーチ・画面揺れ・紙吹雪 ----
   リーチ = どちらかが「あと★1つで勝ち」の間。BGMを少し速め（REACH_RATE）、ビートへの反応を強め（REACH_BEAT）、画面の縁を光らせる。切り替わりで帯を出す
   決着の画面揺れ = バトルの最後の審判の行で小さく、ゲームが決まるときは大きく。紙吹雪は勝ったとき */
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches; // 「視差効果を減らす」設定のときは、揺れと紙吹雪を出さない
let bannerTO=0;
function showBanner(t){
  const b=$('#banner');b.textContent=t;b.hidden=false;b.style.animation='none';b.offsetWidth;b.style.animation='';
  clearTimeout(bannerTO);bannerTO=setTimeout(()=>{b.hidden=true},1600);
}
function reachState(s){
  if(!s.opponent||s.phase==='finished'||s.phase==='lobby')return '';
  const w=s.starsToWin-1,a=s.me.stars>=w,b=s.opponent.stars>=w;
  return a&&b?'ダブルリーチ！':a?'リーチ！':b?'あいてがリーチ！':'';
}
function setReach(txt){
  if(txt===reachTxt)return;
  reachTxt=txt;
  document.documentElement.toggleAttribute('data-reach',!!txt);
  const r=txt?REACH_RATE:1;
  try{bgmA.defaultPlaybackRate=r;bgmA.playbackRate=r;bgmA.preservesPitch=true}catch{} // 音程はそのままで速さだけ変える
  if(txt){showBanner(txt);playSE('round')}else $('#banner').hidden=true;
}
function shake(big){
  if(calm)return;
  const m=$('main');m.classList.remove('shake','shake-big');m.offsetWidth;
  m.classList.add(big?'shake-big':'shake');
  setTimeout(()=>m.classList.remove('shake','shake-big'),big?800:450);
}
const CF_COLORS=['#ff6fae','#ffd23f','#5ecbff','#8be04e','#b28dff','#ff8a3d'];
let cfP=[],cfRun=false;
function confetti(n=80){
  if(calm)return;
  const cv=$('#confetti');cv.width=innerWidth;cv.height=innerHeight;
  for(let i=0;i<n;i++)cfP.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*3.5,w:7+Math.random()*7,h:4+Math.random()*6,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,c:CF_COLORS[i%CF_COLORS.length]});
  if(!cfRun){cfRun=true;requestAnimationFrame(cfTick)}
}
function cfTick(){
  const cv=$('#confetti'),g=cv.getContext('2d');
  g.clearRect(0,0,cv.width,cv.height);
  cfP=cfP.filter(p=>p.y<cv.height+30);
  for(const p of cfP){p.x+=p.vx+Math.sin(p.y/40)*.8;p.y+=p.vy;p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()}
  if(cfP.length)requestAnimationFrame(cfTick);else{cfRun=false;g.clearRect(0,0,cv.width,cv.height)}
}

let finSE=false,histTok=0;
let ws,code,S=null,pending=null,anim=false,skip=false,leaving=false,retry=0,myCard='',builtKey='',names={me:'',opp:''},disp={me:'',opp:''},shown={me:0,opp:0},lastKey=''; // disp = 上の名前欄に出す名前（名乗りが出そろった時点の名乗りに差し替わる。空なら通信で届いた名前）
function connect(c){setReach('');code=c;$('#roomId').innerHTML='合言葉：<b>'+c+'</b>';leaving=false;S=null;finSE=false;histTok++;drumKey='';pending=null;anim=false;myCard='';builtKey='';lastKey='';shown={me:0,opp:0};disp={me:'',opp:''};showArena(false);$('#theme').hidden=true;$('#themeNote').hidden=true;drawBars();pc={};stage(wait_(pk('conn',TXT.connecting)));show('battle');open()}

  ws.onmessage=e=>handle(JSON.parse(e.data));

function handle(m){

const wait=ms=>new Promise(r=>{const t=Date.now(),i=setInterval(()=>{if(skip||Date.now()-t>=ms){clearInterval(i);r()}},80)});
function showArena(on){$('#arena').hidden=!on;$('#stage').hidden=on;if(!on)showVs(false);if(on)stag($('#arena'))}
const ctl=(...k)=>{const c=$('#ctl');c.replaceChildren(...k.filter(Boolean));stag(c)};
// 名乗りの読み合い時間の目安（読み上げオフのとき）。1人ぶん = READ_BASE + 説明文の文字数 × READ_PER_CHAR（ミリ秒）
const READ_BASE=2500,READ_PER_CHAR=35,GLARE_MS=1800;
let readTok=0,readSkip=false,readOk=true,playTok=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function showVs(on){$('#vs').hidden=!on;$('#log').hidden=on}
function setFocus(side){ // side: 'me' | 'opp' | null（どちらも読んでいない）
  const set=(sel,me)=>{const e=$(sel);if(!e)return;e.classList.toggle('focus',side===me);e.classList.toggle('dim',!!side&&side!==me)};
  set('#meCard .nm','me');set('#oppCard .nm','opp');
  const v=(sel,me)=>{const e=$(sel);if(e)e.classList.toggle('dim',!!side&&side!==me)};
  v('#vsMe','me');v('#vsOpp','opp');
}
function stopReading(){
  readTok++;
  if(canSpeak)try{speechSynthesis.cancel()}catch{}
  duck=1;bgmVol();setFocus(null);
}
// テキストを読み上げる。最後まで読めたら true、使えない・失敗・中断なら false
// abort: 中断してよいかを返す関数。声が出ない端末は、2回続けて失敗した時点で以後は読み上げを試さない（トグルを押し直すと再挑戦）
function say(text,abort){
  return new Promise(res=>{
    if(!speakOn||!canSpeak||!text||speechFails>=2){res(false);return}
    let done=false,started=false,iv,to,wd;
    const fin=ok=>{
      if(done)return;done=true;clearInterval(iv);clearTimeout(to);clearTimeout(wd);
      if(!ok)try{speechSynthesis.cancel()}catch{}
      else speechFails=0;
      duck=1;bgmVol();res(ok);
    };
    try{
      if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang='ja-JP';u.rate=speakRate();u.volume=clamp01(speakVol/100);
      if(!touch){const v=speechSynthesis.getVoices().find(x=>/^ja/i.test(x.lang));if(v)u.voice=v} // スマホは声の指定をせず端末の標準に任せる
      u.onstart=()=>{started=true;clearTimeout(wd)};
      u.onend=()=>fin(true);
      u.onerror=e=>{if(!abort()&&e.error!=='interrupted'&&e.error!=='canceled')speechFails++;fin(false)};
      wd=setTimeout(()=>{if(!started){speechFails++;fin(false)}},2000); // 2秒たっても始まらない＝この端末では出ない
      iv=setInterval(()=>{if(abort()||!speakOn)fin(false)},100);
      to=setTimeout(()=>fin(false),Math.max(8000,text.length*300)); // 読み終わりの通知が来ない端末の保険
      duck=.35;bgmVol();
      setTimeout(()=>{if(!done){try{speechSynthesis.resume();speechSynthesis.speak(u)}catch{fin(false)}}},60); // cancel直後のspeakが無視される端末への配慮
    }catch{fin(false)}
  });
}
// 名乗りが出そろったら、まず睨み合い、次に1人ずつ読む。読み終えるまで「いざ、勝負！」は出さない
async function startReading(c){
  const tok=++readTok;
  readSkip=false;readOk=false;
  const live=()=>tok===readTok&&!readSkip;
  const abort=()=>!live();
  const hold=async ms=>{const t=Date.now();while(live()&&Date.now()-t<ms)await sleep(80)};
  const me=c.me,opp=c.opponent;
  await hold(GLARE_MS);
  if(live())await say(`${me.cardName}、たい、${opp.cardName}`,abort);
  for(const [side,x] of [['me',me],['opp',opp]]){
    if(!live())break;
    setFocus(side);
    const ok=await say(`${x.cardName}。${x.card.description}`,abort);
    if(!ok)await hold(READ_BASE+x.card.description.length*READ_PER_CHAR);
  }
  if(tok!==readTok)return;
  setFocus(null);
  readOk=true;
  if(S&&S.phase==='reveal')revealCtl();
}
// 名乗り公開中の下部コントロール（読み合い中 → 生成待ち → 勝負ボタン → 相手待ち）
function revealCtl(){
  const s=S;
  if(!readOk){
    ctl(el('button',{class:'sm',onclick:()=>{readSkip=true;if(canSpeak)try{speechSynthesis.cancel()}catch{}}},'読み飛ばす'),
      s.battleReady?null:wait_(pk('battle'+s.turn,TXT.battleWait)));
  }else if(!s.battleReady)ctl(wait_(pk('battle'+s.turn,TXT.battleWait)));
  else if(!s.me.started)ctl(el('button',{class:'pri',onclick:e=>{e.target.disabled=true;send({type:'start'})}},'いざ、勝負！'));
  else ctl(wait_(pk('ready'+s.turn,TXT.readyWait)));
}
// 名乗りが出そろった瞬間：上の名前欄を今の名乗りに差し替え、自分の名前（ホームの名札・次回の入室名）も同じ名乗りにする。最後に名乗った名前が残る
function adoptNames(c){
  disp={me:c.me.cardName,opp:c.opponent.cardName};
  const m=$('#meBar>div'),o=$('#oppBar>div');
  if(m)m.textContent=disp.me;
  if(o)o.textContent=disp.opp;
  if(disp.me)LS.set('name',disp.me);
}
function buildArena(c,vs=false){
  adoptNames(c);
  names={me:c.me.cardName,opp:c.opponent.cardName};
  $('#meCard').replaceChildren(nmEl(c.me.cardName,c.me.card));
  $('#oppCard').replaceChildren(nmEl(c.opponent.cardName,c.opponent.card));
  $('#log').replaceChildren();
  const emo=x=>x.card&&x.card.emoji?el('span',{class:'emo'},x.card.emoji):null;
  $('#vs').replaceChildren(el('div',{class:'vsn me',id:'vsMe'},c.me.cardName,emo(c.me)),el('div',{class:'vsx'},'VS'),el('div',{class:'vsn opp',id:'vsOpp'},c.opponent.cardName,emo(c.opponent)));
  showVs(vs);
  showArena(true);

function addMsg(l){
  const log=$('#log');
  const m=el('div',{class:'msg '+l.side},l.text);
  log.append(m);
  if(l.side==='me'||l.side==='opp')playSE('slide'); // 左右から滑ってくる行だけ（ナレーションも鳴らすなら条件を外す）
  const pad=parseFloat(getComputedStyle(log).paddingBottom)||0;
  if(m.offsetHeight>log.clientHeight-pad*2){ // 表示領域より長い行（スマホ）：頭から読めるように合わせ、少し後に末尾へ流す
    log.scrollTop=log.scrollHeight-pad*2-m.offsetHeight;
    setTimeout(()=>log.scrollTo({top:log.scrollHeight,behavior:'smooth'}),1000);
  }else log.scrollTop=log.scrollHeight; // 下に流れる。スクロール不要
}
async function playResult(m){
  anim=true;skip=false;lastKey='';
  stopReading();
  setTheme(m.theme);
  if($('#arena').hidden)buildArena({me:m.me,opponent:m.opponent});
  showVs(false);
  $('#log').replaceChildren();
  ctl(el('button',{class:'sm',onclick:()=>skip=true},'スキップ'));
  const my=++playTok,abort=()=>skip||my!==playTok;
  await wait(700);
  for(const l of m.log){
    if(my!==playTok)return; // 場を去った・別のゲームに移った
    addMsg(l);
    const ok=await say(l.text,abort); // 読み終わってから次の行へ
    if(ok)await wait(250);else await wait(1800); // 読み上げできないときは従来どおり一定間隔
  }
  if(my!==playTok)return;
  shake(m.gameOver);if(m.youWon)confetti(m.gameOver?120:40); // 審判の最後の行が出た瞬間
  ctl(el('div',{class:'verdict'+(m.youWon?'':' lose')},rpick(m.youWon?TXT.turnWin:TXT.turnLose)),
    el('button',{class:'pri',onclick:()=>{
      anim=false;const p=pending;pending=null;
      if(p)apply(p);else if(m.gameOver)apply({...S,phase:'finished',youWonGame:m.youWon,me:{...S.me,rematch:false}});else apply(S);
    }},m.gameOver?'結果へ':'次の名乗りへ'));
  drawBars(m.stars.me,m.stars.opponent);
  saveCard(m);
}

/* ---- 名乗り図鑑（localStorage） ---- */
const COLL_PER_PAGE=10; // 1ページの件数
let collPage=0;
function saveCard(m){
  const c=m.me.card,all=LS.get('cards',[]);
  all.unshift({id:Date.now()+Math.random().toString(36).slice(2,6),name:m.me.cardName,emoji:c.emoji||'',description:c.description,params:c.params,weak:!!c.weak,theme:m.theme,won:m.youWon,opp:m.opponent.cardName});
  LS.set('cards',all.slice(0,200));
}
function openColl(c){ // 一覧の1行を押したとき：詳細ウインドウ（説明文とパラメータつき）
  $('#collModalBody').replaceChildren(nmEl(c.name,c,`お題「${c.theme}」　${c.won?'勝ち':'負け'}　相手「${c.opp||'—'}」`));
  const d=$('#collModal');if(!d.open)d.showModal();
}
$('#collModalClose').onclick=()=>$('#collModal').close();
$('#collModal').addEventListener('click',e=>{if(e.target===$('#collModal'))$('#collModal').close()}); // 外側（暗い部分）を押しても閉じる
function drawColl(anim=true){
  const all=LS.get('cards',[]),pages=Math.max(1,Math.ceil(all.length/COLL_PER_PAGE));
  collPage=Math.min(Math.max(collPage,0),pages-1);
  const g=$('#collList'),pg=$('#collPager');
  g.classList.toggle('still',!anim);
  const part=all.slice(collPage*COLL_PER_PAGE,(collPage+1)*COLL_PER_PAGE);
  g.replaceChildren(...(part.length?part.map(c=>el('li',{},el('button',{class:'crow',onclick:()=>openColl(c)},
    el('span',{class:'crow__name'},c.name,c.emoji?el('span',{class:'emo'},c.emoji):null),
    el('span',{class:'crow__theme'},`お題「${c.theme}」`),
    el('span',{class:'crow__res'+(c.won?'':' l')},c.won?'勝ち':'負け'),
    el('span',{class:'crow__opp'},c.opp||'—')))):[el('li',{},el('p',{class:'status'},rpick(TXT.collEmpty)))]));
  stag(g);
  const go=d=>()=>{collPage+=d;drawColl();window.scrollTo(0,0)};
  pg.replaceChildren(...(all.length>COLL_PER_PAGE?[
    el('button',{class:'ghost sm',disabled:collPage===0?'':null,onclick:go(-1)},'◀ 前へ'),
    el('span',{},`${collPage+1} / ${pages}`),
    el('button',{class:'ghost sm',disabled:collPage>=pages-1?'':null,onclick:go(1)},'次へ ▶')]:[]));
}
</script>
